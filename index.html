<title>Marathon Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a race-bib header over a single column of training cards, tabs pinned under the header like lane markers. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface2:#F5F7F9; --line:#D8DEE5;
  --ink:#16202B; --ink2:#4A5866; --ink3:#7C8896;
  --lane:#1F5BD8; --lane-soft:#E3EBFB;
  --bib:#F2C230; --bib-ink:#1A1608;
  --h1:#7A8FA3; --h2:#4F8A8B; --h3:#3E6C8A; --base:#5E9C7A; --thr:#D98A2B; --spec:#1F5BD8; --taper:#8A6CC9;
  --good:#2E8A57; --warn:#C27A12; --bad:#C2412F;
  --track:#E1E6EC;
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141B; --surface:#161E27; --surface2:#1C2631; --line:#2A3642;
  --ink:#E8EDF2; --ink2:#AAB6C2; --ink3:#7A8794;
  --lane:#6E9BFF; --lane-soft:#1D2B47;
  --bib:#F2C230; --bib-ink:#1A1608;
  --h1:#8FA3B8; --h2:#6FB0B1; --h3:#6E9CC0; --base:#77B892; --thr:#E8A04A; --spec:#6E9BFF; --taper:#AB91E6;
  --good:#5CC48A; --warn:#E8A04A; --bad:#EF7666; --track:#26313C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#161E27; --surface2:#1C2631; --line:#2A3642;
  --ink:#E8EDF2; --ink2:#AAB6C2; --ink3:#7A8794;
  --lane:#6E9BFF; --lane-soft:#1D2B47;
  --bib:#F2C230; --bib-ink:#1A1608;
  --h1:#8FA3B8; --h2:#6FB0B1; --h3:#6E9CC0; --base:#77B892; --thr:#E8A04A; --spec:#6E9BFF; --taper:#AB91E6;
  --good:#5CC48A; --warn:#E8A04A; --bad:#EF7666; --track:#26313C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:760px;margin-inline:auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lane);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;line-height:1.05;text-wrap:balance;margin:0}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.muted{color:var(--ink2)} .faint{color:var(--ink3);font-size:.8rem}
p{margin:0}

/* Bib header */
.bib{margin-top:16px;background:var(--bib);color:var(--bib-ink);border-radius:18px;padding:16px 18px 18px;position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.bib::before,.bib::after{content:"";position:absolute;top:12px;width:9px;height:9px;border-radius:50%;background:var(--bg)}
.bib::before{left:12px}.bib::after{right:12px}
.bib .race{font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding-left:14px}
.bib .count{font-family:var(--f-display);font-weight:800;font-size:clamp(3.2rem,13vw,5rem);line-height:.9;margin-top:6px;font-variant-numeric:tabular-nums}
.bib .count small{font-size:.32em;font-weight:700;letter-spacing:.06em;margin-left:6px;text-transform:uppercase}
.bib .sub{font-size:.88rem;margin-top:6px;font-weight:500}
.sync{margin-top:12px;display:inline-flex;align-items:center;gap:7px;border:1.5px solid rgba(26,22,8,.35);background:transparent;border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:600;color:var(--bib-ink);white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:rgba(26,22,8,.35)}
.sync[data-s="ok"] .dot{background:#2E8A57}.sync[data-s="err"] .dot{background:#C2412F}
.sync[data-s="loading"] .dot{background:#1F5BD8;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;margin-top:4px}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:2px}
.tabbar button{border:0;background:transparent;border-radius:9px;padding:8px 2px;font-size:.82rem;font-weight:600;color:var(--ink2)}
.tabbar button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 12px;font-size:.85rem;font-weight:600}
.btn.primary{background:var(--lane);border-color:var(--lane);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.note{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:.88rem;color:var(--ink2)}
.note b{color:var(--ink);display:block;font-size:.8rem;margin-bottom:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 12px}
.stat .l{font-size:.72rem;color:var(--ink3);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .v small{font-size:.55em;color:var(--ink3);font-weight:600;margin-left:3px}

/* Meter */
.meter{height:10px;background:var(--track);border-radius:99px;overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--lane);border-radius:99px}

/* Today */
.today{display:grid;gap:10px}
.today .what{font-family:var(--f-display);font-size:1.9rem;font-weight:700;line-height:1}
.today .what .num{font-family:var(--f-display)}

/* Week */
.wk-nav{display:flex;align-items:center;gap:8px}
.wk-nav button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:1rem}
.days{display:grid;gap:0;margin-top:8px}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.day:first-child{border-top:0}
.day.is-today{background:var(--lane-soft);margin-inline:-16px;padding-inline:16px;border-radius:10px;border-top-color:transparent}
.day.is-today + .day{border-top-color:transparent}
.dname{font-family:var(--f-display);font-weight:700;font-size:1.1rem;line-height:1}
.dname small{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;color:var(--ink3);margin-top:3px}
.dwork{min-width:0}
.dwork .t{font-weight:600}
.dwork .p{font-size:.82rem;color:var(--ink2)}
.dmi{font-family:var(--f-display);font-weight:700;font-size:1.3rem;text-align:right;font-variant-numeric:tabular-nums}
.dmi small{display:block;font-family:var(--f-body);font-size:.7rem;color:var(--ink3);font-weight:500}
.done{display:inline-flex;gap:6px;align-items:center;margin-top:5px;font-size:.78rem;font-weight:600;border-radius:7px;padding:2px 8px;background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.done.miss{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.done.other{background:var(--surface2);color:var(--ink2)}
.zone{display:inline-block;font-family:var(--f-mono);font-size:.68rem;padding:1px 6px;border-radius:5px;margin-right:6px;vertical-align:1px;color:#fff}
.z-E,.z-L{background:var(--base)}.z-T{background:var(--thr)}.z-I{background:var(--bad)}.z-MP{background:var(--spec)}.z-R{background:var(--bib);color:var(--bib-ink)}.z-X{background:var(--ink3)}.z-TT{background:var(--bib);color:var(--bib-ink)}.z-BIKE{background:#B5562A}.z-SWIM{background:#1D86A8}.z-LIFT{background:#5B4A8B}.z-MOB{background:var(--ink3)}
.sess+.sess{margin-top:7px}
.ex{margin:3px 0 0;padding-left:18px;font-size:.84rem;color:var(--ink2)}
.ex li{margin:1px 0}
.cite{display:grid;gap:10px;margin:10px 0 0;padding:0;list-style:none}
.cite li{font-size:.88rem;color:var(--ink2)}
.cite b{color:var(--ink)}
.cite .src{display:block;font-size:.76rem;color:var(--ink3)}

/* Chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink3);font-family:var(--f-mono);font-size:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;padding-right:0}
.scroll{overflow-x:auto}

/* Runs */
.runs{display:grid}
.run{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.run:first-child{border-top:0}
.run .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run .m{text-align:right;font-family:var(--f-mono);font-size:.85rem}

/* Plan */
.phase{display:grid;gap:4px}
.wkrow{display:grid;grid-template-columns:42px 1fr 64px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.wkrow:hover{background:var(--surface2)}
.wkrow .w{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.wkrow .bar{height:8px;border-radius:4px;background:var(--track);position:relative;overflow:hidden}
.wkrow .bar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.wkrow .mi{text-align:right;font-family:var(--f-mono);font-size:.85rem}
.wkrow.cur{background:var(--lane-soft)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:.75rem;font-weight:600;color:var(--ink2)}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:8px 10px}
.field .hint{font-size:.72rem;color:var(--ink3)}

.connect{border:2px solid var(--lane);background:var(--lane-soft)}
.connect ol{margin:8px 0 0;padding-left:20px;color:var(--ink2);font-size:.9rem}
.connect a{color:var(--lane);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 12px;font-size:.82rem;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.foot{text-align:center;margin-top:24px;font-size:.75rem;color:var(--ink3)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.tabbar button{font-size:.74rem}.day{grid-template-columns:44px 1fr auto;gap:10px}}
</style>

<div class="wrap">
  <header class="bib" id="bib">
    <div>
      <div class="race" id="raceName">Grandma's Marathon</div>
      <div class="count" id="count">--<small>days</small></div>
      <div class="sub" id="bibSub">Loading your plan</div>
    </div>
    <button class="sync" id="sync" data-s="idle" aria-label="Refresh Strava"><span class="dot"></span><span id="syncTxt">Strava</span></button>
  </header>

  <nav class="tabs" aria-label="Sections">
    <div class="tabbar" role="tablist" id="tabbar">
      <button role="tab" id="tab-week" data-tab="week">Week</button>
      <button role="tab" id="tab-progress" data-tab="progress">Progress</button>
      <button role="tab" id="tab-paces" data-tab="paces">Paces</button>
      <button role="tab" id="tab-plan" data-tab="plan">Plan</button>
    </div>
  </nav>

  <div id="connect"></div>
  <main class="stack" id="view" role="tabpanel"></main>
  <div class="foot">Runs, best efforts and heart rate zones from your connected Strava account.</div>
</div>

<script>
/* ===================== Dates ===================== */
const DAY=864e5, MI=1609.344, BLOCK=18;
const pad=n=>String(n).padStart(2,"0");
const toT=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d);};
const toS=t=>new Date(t).toISOString().slice(0,10);
const add=(s,n)=>toS(toT(s)+n*DAY);
const TODAY=(()=>{const n=new Date();return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`;})();
const fmtD=(s,o={month:"short",day:"numeric"})=>new Date(toT(s)).toLocaleDateString("en-US",{...o,timeZone:"UTC"});
const dow=s=>(new Date(toT(s)).getUTCDay()+6)%7; // Mon=0
const monday=s=>add(s,-dow(s));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));

/* ===================== Settings ===================== */
const DEF={raceName:"Grandma's Marathon",race:"2027-06-19",start:"2026-10-12",goal:"3:29:00",peak:"50",
  src:"strava",winter:"dec-feb",benchDist:"10000",benchTime:"46:00",startVol:null};
let S={...DEF};
try{const s=JSON.parse(localStorage.getItem("mbuild2")||"null"); if(s) S={...DEF,...s};}catch(e){}

/* ===================== Pace math (Daniels / Gilbert VDOT) ===================== */
const vo2=v=>-4.6+0.182258*v+0.000104*v*v;
const pctMax=t=>0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);
const vdot=(m,t)=>vo2(m/t)/pctMax(t);
const velAt=(f,V)=>{const c=-4.6-f*V;return(-0.182258+Math.sqrt(0.182258**2-4*0.000104*c))/(2*0.000104);};
const raceT=(m,V)=>{let lo=m/450,hi=m/60;for(let k=0;k<60;k++){const mid=(lo+hi)/2;vdot(m,mid)>V?lo=mid:hi=mid;}return(lo+hi)/2;};
const parseT=s=>{const p=String(s).trim().split(":").map(Number);if(!p.length||p.some(isNaN))return NaN;return p.length===3?p[0]*60+p[1]+p[2]/60:p.length===2?p[0]+p[1]/60:p[0];};
const fmtP=min=>{if(!isFinite(min))return"--";let m=Math.floor(min),s=Math.round((min-m)*60);if(s===60){m++;s=0;}return`${m}:${pad(s)}`;};
const fmtH=min=>{const h=Math.floor(min/60),r=min-h*60;let m=Math.floor(r),s=Math.round((r-m)*60);if(s===60){m++;s=0;}return h?`${h}:${pad(m)}:${pad(s)}`:`${m}:${pad(s)}`;};
const BD=[{m:5000,k:"5K"},{m:10000,k:"10K"},{m:21097.5,k:"Half marathon"}];
function fitness(){
  const b=bests();
  if(S.src==="strava"&&b.V>0) return {V:b.V,from:b.from,strava:true};
  const t=parseT(S.benchTime), m=Number(S.benchDist);
  return {V:(t>0&&m>0)?vdot(m,t):45,strava:false};
}
function Z(){
  const f=fitness(), V=f.V, pv=v=>MI/v;
  const mar=raceT(42195,V), hm=raceT(21097.5,V), g=parseT(S.goal), goalMar=g>0?g:mar;
  return {V,f,mar,hm,goalMar,MP:goalMar/(42195/MI),HM:hm/(21097.5/MI),
    E:[pv(velAt(.66,V)),pv(velAt(.59,V))],T:pv(velAt(.86,V)),I:pv(velAt(.975,V))};
}
const ZONES={E:"Easy",L:"Long",MP:"Marathon pace",T:"Threshold",I:"Interval",TT:"Time trial",R:"Race",X:"Rest"};
function zoneTarget(k,z){
  z=z||Z();
  if(k==="E"||k==="L") return `${fmtP(z.E[0])}–${fmtP(z.E[1])}/mi`;
  if(k==="MP"||k==="R") return `${fmtP(z.MP)}/mi`;
  if(k==="T") return `${fmtP(z.T)}/mi`;
  if(k==="I") return `${fmtP(z.I)}/mi`;
  if(k==="TT") return "hard and even, all you can hold";
  return "";
}
function hrTarget(k){
  if(!HRZ) return "";
  const z=n=>HRZ[n]||{}, mx=v=>v>0?v:null;
  if(k==="E"||k==="L") return `HR under ${z(1).max}`;
  if(k==="MP"||k==="R") return `HR ${z(2).min}–${mx(z(2).max)||""}`;
  if(k==="T") return `HR ${z(3).min}–${mx(z(3).max)||""}`;
  if(k==="I"||k==="TT") return `HR ${z(4).min}+`;
  return "";
}

/* ===================== Plan generator ===================== */
const BLOCK_PH=[
  {name:"Base",col:"--base",from:0,to:5,blurb:"Mostly easy running, strides and hill sprints. Build the legs before the workouts."},
  {name:"Threshold",col:"--thr",from:6,to:10,blurb:"Tuesday threshold is the key session. Long runs start finishing at marathon pace."},
  {name:"Marathon specific",col:"--spec",from:11,to:14,blurb:"Marathon pace volume peaks. Biggest week lands three weeks out."},
  {name:"Taper",col:"--taper",from:15,to:17,blurb:"Volume drops 40 to 60 percent. Keep some speed so the legs stay sharp."}
];
const VOL=[.55,.6,.66,.55,.7,.75,.78,.84,.7,.88,.92,.94,.97,.8,1,.78,.6,.4];
const QW=[
 [6,"Easy + 6 x 20s strides","E"],[6,"Easy + 6 x 20s strides","E"],[6,"Easy + 8 x 10s hill sprints, walk back","E"],
 [5,"Easy + 6 x 20s strides","E"],[7,"Fartlek: 8 x 1 min quick, 1 min easy","E"],[7,"Easy + 8 x 10s hill sprints","E"],
 [7,"3 x 8 min at threshold, 2 min jog","T"],[8,"4 x 8 min at threshold, 2 min jog","T"],[6,"2 x 12 min at threshold, 3 min jog","T"],
 [8,"3 x 12 min at threshold, 2 min jog","T"],[9,"2 x 20 min at threshold, 3 min jog","T"],
 [8,"5 x 1 km at interval pace, 3 min jog","I"],[9,"3 x 2 mi at threshold, 2 min jog","T"],[7,"6 x 800 m at interval pace, 2 min jog","I"],
 [10,"4 x 2 mi at threshold, 2 min jog","T"],[8,"5 x 1 km at interval pace, 2.5 min jog","I"],[7,"3 x 2 mi at marathon pace, 1 min jog","MP"]
];
const LW=[
 [9,"Easy long run","L"],[10,"Easy long run","L"],[11,"Easy long run","L"],[9,"Easy long run","L"],[12,"Easy long run","L"],[13,"Easy long run","L"],
 [13,"Long run, last 2 mi at marathon pace","MP"],[14,"Long run, last 3 mi at marathon pace","MP"],[11,"Easy long run","L"],
 [15,"Long run with 4 mi at marathon pace in the middle","MP"],[16,"Easy long run","L"],
 [16,"Long run with 2 x 4 mi at marathon pace, 1 mi easy between","MP"],[18,"Long run, last 3 mi steady","L"],
 [13,"Long run with 6 mi at marathon pace","MP"],[20,"Long run with 10 mi at marathon pace","MP"],
 [14,"Long run with 6 mi at marathon pace","MP"],[10,"Easy long run","L"]
];
const r5=x=>Math.max(3,Math.round(x*2)/2);
const peak=()=>clamp(Number(S.peak)||50,25,110);
const raceMon=()=>monday(S.race);
function planStart(){
  let m=monday(S.start||TODAY); const n=Math.round((toT(raceMon())-toT(m))/(7*DAY))+1;
  if(n>52) m=add(raceMon(),-51*7); if(n<6) m=add(raceMon(),-5*7); return m;
}
const NW=()=>Math.round((toT(raceMon())-toT(planStart()))/(7*DAY))+1;
const weekStart=i=>add(planStart(),i*7);
const weekOf=s=>Math.floor((toT(s)-toT(planStart()))/(7*DAY));
const blk=i=>i-(NW()-BLOCK);
const HYB_PH=[
  {name:"Hybrid: Rebuild",col:"--h1",blurb:"Three runs, three or four lifts, two rides and a swim, all mostly easy. Lifting uses moderate weights, slow lowering and light Olympic-lift technique work to get tendons and joints ready."},
  {name:"Hybrid: Strength",col:"--h2",blurb:"Heavy lifting at 4 to 6 reps with power cleans and snatches, sweet spot rides, hill reps and threshold swims. Heavy strength is the lifting most linked to better running economy."},
  {name:"Hybrid: Power",col:"--h3",blurb:"Heavy triples, full Olympic lifts and jumps, 4 x 4 VO2 rides and run tempos. This sets up the marathon build."}
];
function phases(){
  const off=NW()-BLOCK, P=[];
  if(off>0){ const n=Math.ceil(off/3);
    HYB_PH.forEach((p,k)=>{const from=k*n, to=Math.min(off-1,(k+1)*n-1); if(from<=to) P.push({...p,from,to});}); }
  BLOCK_PH.forEach(p=>{const to=p.to+off; if(to>=0) P.push({...p,from:Math.max(0,p.from+off),to});});
  return P;
}
const phaseOf=i=>phases().find(p=>i>=p.from&&i<=p.to)||phases()[0];
const startVol=()=>clamp(Number(S.startVol)||peak()*.45,peak()*.3,peak()*.58);
const REST={mi:0,t:"Rest day",z:"X",x:[]};
const X=(sp,amt,t)=>({sp,amt,t});

function layout(total,q,l,med){
  const out=Array.from({length:7},()=>({...REST,x:[]}));
  const flex=[[2,1,"Easy run"],[3,med?1.4:1,med?"Medium-long run, easy":"Easy run"],[4,.8,"Easy + 6 strides"],[6,.8,"Recovery run, very easy"]];
  const wsum=flex.reduce((a,f)=>a+f[1],0), unit=Math.max(0,total-q.mi-l.mi)/wsum;
  out[0]={mi:0,t:"Rest from running",z:"X",x:[]};
  out[1]={...q,key:1,x:[]};
  flex.forEach(([d,wt,t])=>{out[d]={mi:r5(unit*wt),t,z:"E",x:[]};});
  out[5]={...l,key:1,x:[]};
  if(peak()<35) out[6]={...REST,x:[]};
  return out;
}

/* Hybrid weeks: 3 runs, 4 lifts, 2 rides, 1 swim. Lower-body lifts go in the evening of the hard run or ride days,
   upper-body lifts go on the easier days, and nothing heavy for the legs the day before the long run. */
/* ---------- Winter and holidays ---------- */
const WINTER_MONTHS={"dec-feb":[12,1,2],"nov-mar":[11,12,1,2,3],"off":[]};
const isWinter=ds=>(WINTER_MONTHS[S.winter]||WINTER_MONTHS["dec-feb"]).includes(Number(ds.slice(5,7)));
const winterWeek=i=>isWinter(add(weekStart(i),5)); // judged by the long-run day
function holidayOn(ds){
  const [y,m,d]=ds.split("-").map(Number);
  if(m===12&&d===25) return "Christmas";
  if(m===1&&d===1) return "New Year's Day";
  if(m===11){const first=toS(Date.UTC(y,10,1)), firstThu=1+((3-dow(first)+7)%7); if(d===firstThu+21) return "Thanksgiving";}
  return null;
}
const TREAD="Treadmill at 1% incline if wind chill is below -15°F or the roads are icy.";
const LIFTS={
  lowerA:[
    "Lower A · Mobility warm-up (90/90 hips, ankle rocks) · Olympic technique: hang muscle clean 4 x 3, light · Goblet squat 3 x 10 · Romanian deadlift 3 x 10 · Split squat 3 x 8 · Calf raises 3 x 15",
    "Lower A · Hang power clean 5 x 3 · Back squat 4 x 5, heavy · Bulgarian split squat 3 x 6 · Heavy calf raises 3 x 10 · Hip mobility cool-down",
    "Lower A · Power clean 5 x 2 · Back squat 3 x 3, heavy · Box jumps 4 x 3 · Pogo hops 3 x 20 · Hip mobility cool-down"],
  lowerB:[
    "Lower B · Kettlebell swings 4 x 12 · Step-ups 3 x 10 · Single-leg RDL 3 x 8 · Copenhagen plank and side plank · Hip mobility flow",
    "Lower B · Trap-bar deadlift 4 x 5 · Hang power snatch, technique 4 x 3 · Walking lunges 3 x 8 · Nordic curls 3 x 4 · Mobility cool-down",
    "Lower B · Hang power snatch 5 x 2 · Trap-bar jumps 4 x 3 · Romanian deadlift 3 x 4 · Single-leg bounds 3 x 6 each side · Mobility cool-down"],
  upperA:[
    "Upper A · Push-ups 3 x 12 · Dumbbell bench 3 x 10 · Half-kneeling press 3 x 10 · Rows 3 x 12 · Thoracic and shoulder mobility",
    "Upper A · Bench press 4 x 5 · Push press 4 x 4 · Dips or weighted push-ups 3 x 8 · Rows 3 x 8 · Core: ab wheel, Pallof press",
    "Upper A · Push jerk 5 x 2 · Bench press 3 x 3 · Med-ball chest pass 4 x 5 · Rows 3 x 8 · Shoulder mobility"],
  upperFull:[
    "Upper, push + pull · Push-ups 3 x 12 · Pull-ups (assisted if needed) 3 x 6–8 · Half-kneeling press 3 x 10 · One-arm row 3 x 10 · Farmer carries · 15 min mobility flow",
    "Upper, push + pull · Bench press 4 x 5 · Weighted pull-ups 4 x 5 · Push press 3 x 4 · Barbell row 3 x 6 · Suitcase carries · Mobility flow",
    "Upper, push + pull · Push jerk 5 x 2 · Weighted pull-ups 4 x 3 · Bench press 3 x 3 · Med-ball slams 3 x 5 · Turkish get-ups · Mobility flow"],
  upperB:[
    "Upper B · Pull-ups (assisted if needed) 3 x 6–8 · One-arm row 3 x 10 · Face pulls 3 x 15 · Farmer carries 4 x 40 m · 15 min full-body mobility flow",
    "Upper B · Weighted pull-ups 4 x 5 · Barbell row 4 x 6 · Overhead press 3 x 6 · Suitcase carries 4 x 30 m each side · Mobility flow",
    "Upper B · Weighted pull-ups 4 x 3 · Med-ball slams 4 x 5 · Rows 3 x 6 · Turkish get-ups 3 x 2 each side · Mobility flow"]
};
function hybridWeek(i){
  const F=NW()-BLOCK, n=Math.ceil(F/3), ph=Math.min(2,Math.floor(i/n)), w=i-ph*n, frac=F>1?i/(F-1):1;
  const deload=(i+1)%4===0, k=peak()/50, dl=deload?.7:1;
  const vol=(startVol()+(peak()*.5-startVol())*frac)*(deload?.8:1);
  const min=x=>`${Math.round(x*dl/5)*5} min`, yd=x=>`${(Math.round(x*dl/100)*100).toLocaleString()} yd`;
  const long=r5(Math.min(vol*.42,12*Math.sqrt(k)));
  const lift=(key,pm)=>X("lift",deload?"40 min":key.startsWith("lower")?"60 min":"50 min",
    (pm?"PM, 6+ hours after the morning session. ":"")+(deload?LIFTS[key][ph].split(" · ")[0]+", light week: 2 sets of each lift, technique work on the Olympic lifts, longer mobility.":LIFTS[key][ph]));
  const runQ=[
    w%2?"Easy + 8 x 10s hill sprints, walk back":"Easy + 6 x 20s strides",
    w%2?"Hills: 8 x 60s up at hard effort, jog down":"Fartlek: 8 x 1 min quick, 1 min easy",
    w<2?"Tempo: 20 min at threshold":"Tempo: 3 x 10 min at threshold, 2 min jog"][ph];
  const bikeQ=deload?"Bike, easy: zone 2, high cadence"
    :["Bike: zone 2 with 6 x 30s high-cadence spin-ups",
      w<3?"Bike sweet spot: 3 x 12 min at 88–93% FTP, 4 min easy":"Bike threshold: 2 x 20 min at 95% FTP, 5 min easy",
      "Bike VO2: 4 x 4 min hard (90–95% max HR), 3 min easy"][ph];
  const swim=deload?"Swim aerobic, relaxed, drills between sets"
    :["Swim: technique drills (catch-up, fingertip drag, 6-kick switch), then 8 x 100 yd steady",
      "Swim: drills, then 10 x 100 yd at CSS pace, 15s rest",
      "Swim: drills, then 3 x 500 yd steady, 30s rest"][ph];
  const winter=winterWeek(i), wk=i;
  const hol=[0,1,2,3,4,5,6].map(d=>holidayOn(add(weekStart(i),d)));
  // 4 lifts most weeks; 3 in the first two weeks (ease in), lighter weeks and holiday weeks
  const three=i<2||deload||hol.some(Boolean);
  const liftHol=[0,3,4].some(d=>hol[d]); // a holiday already removes one lift, so keep Upper A
  const out=Array.from({length:7},()=>({...REST,x:[]}));
  const tm=winter?" "+TREAD:"";
  out[0]=deload?{mi:r5(6*Math.min(k,1.2)),t:"5K time trial: 2 mi warm-up, 5K hard and even, 1 mi cool-down."+(winter?" Treadmill at 1% incline is fine in the cold; Strava still logs the effort.":""),z:"TT",key:1,x:[lift("lowerA",true)]}
    :{mi:r5(vol*.3),t:runQ+"."+tm,z:ph===2?"T":"E",key:1,x:[lift("lowerA",true)]};
  out[1]={mi:0,t:"Rest from running",z:"X",x:[X("swim",yd(2000+ph*400),swim),...(three&&!liftHol?[]:[lift("upperA",false)])]};
  out[2]={mi:r5(vol*.28),t:"Easy run, zone 2."+tm,z:"E",x:[X("mob","30 min","Mobility: hips, ankles, thoracic spine. Lightest day of the week.")]};
  out[3]={mi:0,t:"Rest from running",z:"X",x:[X("bike",min(60+ph*10),(winter?"Indoor trainer. ":"")+bikeQ),lift("lowerB",true)]};
  out[4]={mi:0,t:"Rest from running",z:"X",x:[lift(three&&!liftHol?"upperFull":"upperB",false)]};
  if(winter){
    const cap=r5(Math.min(long,7*Math.sqrt(k)));
    out[5]={mi:cap,t:"Winter long run, 60–70 min max. Go midday when it's warmest, start into the wind so it's at your back on the way home. Treadmill if wind chill is below -15°F.",z:"L",key:1,x:[]};
    out[6]={mi:0,t:"Rest from running",z:"X",x:[X("bike",min(120+ph*15+w*5),"Indoor long ride on the trainer, zone 2. This replaces the long-run time you skip outside."+(ph===2?" Practice fueling: 60–90 g carbs per hour.":""))]};
  }else{
    out[5]={mi:long,t:"Easy long run",z:"L",key:1,x:[]};
    out[6]={mi:0,t:"Rest from running",z:"X",x:[X("bike",min(90+ph*15+w*5),ph===2?"Long ride, zone 2. Practice fueling: 60–90 g carbs per hour.":"Long ride, zone 2, conversational")]};
  }
  // holidays: take the day off, offer the fun option
  hol.forEach((h,d)=>{ if(!h) return;
    out[d]= h==="Thanksgiving"
      ?{mi:0,t:"Rest from running",z:"X",x:[X("mob","Optional","Thanksgiving: run a local Turkey Trot for fun, or take an easy 45 min spin. No lifting today.")]}
      :{mi:0,t:`${h}: rest day. An easy walk with family counts.`,z:"X",x:[]};
  });
  return out;
}

/* Marathon block: strength 2x a week in base, 1x maintenance through the specific phase, tapering off before race week. */
function blockExtras(b,days){
  const add_=(d,s)=>{if(days[d]) days[d].x.push(s);};
  if(b<=5){
    add_(1,X("lift","45 min","PM, 6+ hours after the run. Heavy lower: squat or trap-bar deadlift 3 x 4–6, box jumps 3 x 3, calf raises."));
    add_(3,X("lift","40 min","PM. Single-leg and upper: split squat 3 x 6, single-leg RDL, push and pull 3 x 6."));
    add_(0,X("swim","1,500 yd","Easy swim, technique focus. Recovery only."));
    add_(2,X("bike","30–45 min","Optional easy spin, recovery only."));
  }else if(b<=14){
    add_(1,X("lift","30 min","PM maintenance: squat or trap-bar deadlift 3 x 3 heavy, box jumps 3 x 3. One session a week holds strength."));
    add_(0,X("swim","1,500 yd","Easy swim, recovery only."));
    add_(2,X("bike","30 min","Optional easy spin, recovery only."));
  }else if(b<=16){
    add_(1,X("lift",b===15?"25 min":"15 min",b===15?"Light strength: 2 x 3 at a moderate weight, a few jumps.":"Activation only: bodyweight squats, glute bridges, calf raises."));
    add_(0,X("swim","1,000 yd","Easy swim, loosen up."));
  }
  return days;
}

function buildWeek(i){
  const k=peak()/50, b=blk(i);
  if(b<0) return hybridWeek(i);
  if(b===BLOCK-1){
    const out=Array.from({length:7},()=>({...REST,x:[]}));
    const ri=dow(S.race), put=(d,v)=>{if(d>=0&&d<7) out[d]={x:[],...v};}, s=Math.min(k,1.2);
    put(ri,{mi:26.2,t:S.raceName||"Marathon",z:"R"});
    put(ri-1,{mi:2,t:"Shakeout + 3 strides. Carb load: 8–10 g per kg today.",z:"E"});
    put(ri-2,{mi:0,t:"Rest. Lay out your race kit.",z:"X"});
    put(ri-3,{mi:3,t:"Easy + 4 strides",z:"E"});
    put(ri-4,{mi:r5(4*s),t:"Easy run",z:"E"});
    put(ri-5,{mi:r5(6*s),t:"3 x 1 mi at marathon pace, 2 min jog",z:"MP"});
    put(ri-6,{mi:r5(5*s),t:"Easy + 6 strides",z:"E"});
    return out;
  }
  const q=QW[b], l=LW[b];
  const wl=winterWeek(i)?" Winter: treadmill, or split it into a morning and afternoon run if wind chill is below -15°F.":"";
  return blockExtras(b,layout(peak()*VOL[b],{mi:r5(q[0]*k),t:q[1],z:q[2]},{mi:Math.min(22,r5(l[0]*Math.sqrt(k))),t:l[1]+"."+wl,z:l[2]},b>=6));
}
const weekMi=i=>buildWeek(i).reduce((a,d)=>a+d.mi,0);
const parseMin=a=>{const m=String(a).match(/(\d+)(?:–(\d+))?\s*min/);return m?(Number(m[2]||m[1])):0;};
const parseYd=a=>{const m=String(a).replace(/,/g,"").match(/(\d+)\s*yd/);return m?Number(m[1]):0;};
function weekLoad(i){
  const t={bike:0,swim:0,lift:0};
  buildWeek(i).forEach(d=>d.x.forEach(s=>{ if(s.sp==="bike"&&!/Optional/.test(s.t)) t.bike+=parseMin(s.amt); if(s.sp==="swim") t.swim+=parseYd(s.amt); if(s.sp==="lift") t.lift++; }));
  return t;
}

/* ===================== Strava ===================== */
const RUNS=new Set(["Run","TrailRun","VirtualRun"]);
let ACTS=[], SYNC={state:"idle",msg:"",at:null}, HRZ=null;
const PERF={}; let ENRICH={status:"idle",done:0,total:0};
let MCP=null, PERMS=null, DB=null;
const getMcp=async()=>{ if(MCP) return MCP; try{ MCP=window.claude&&window.claude.use?await window.claude.use("mcp"):null; }catch(e){MCP=null;} return MCP; };
const getPerms=async()=>{ if(PERMS) return PERMS; try{ PERMS=window.claude&&window.claude.use?await window.claude.use("permissions"):null; }catch(e){PERMS=null;} return PERMS; };
const payload=r=>{let p=r&&r.payload; if(typeof p==="string"){try{p=JSON.parse(p);}catch(_){p={};}} return p||{};};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function callT(tool,input,opts){
  const mcp=await getMcp();
  try{ return await mcp.callTool("Strava",tool,input,opts); }
  catch(e){ if(e&&e.retryable){ await sleep((e.retryAfterMs||1500)+Math.random()*700); return await mcp.callTool("Strava",tool,input,opts); } throw e; }
}
const AUTHZ=["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","selection_required","not_granted","capability_disabled"];

async function sync(refresh){
  const mcp=await getMcp();
  if(!mcp){SYNC={state:"off"};renderAll();return;}
  if(SYNC.state==="loading") return;
  SYNC={...SYNC,state:"loading"}; renderAll();
  const since=add([planStart(),monday(TODAY)].sort()[0],-84)+"T00:00:00";
  const opts={cache:refresh?{refresh:true,staleTime:60000}:{staleTime:300000}};
  try{
    let all=[],after=null,pages=0,stored=null;
    do{
      const input={first:100,range_start:since}; if(after) input.after=after;
      const res=await callT("list_activities",input,opts), p=payload(res);
      all=all.concat(p.activities||[]);
      if(res.cache&&res.cache.storedAt&&!stored) stored=res.cache.storedAt;
      after=p.has_next_page?p.end_cursor:null; pages++;
    }while(after&&pages<15);
    ACTS=all.map(a=>({id:String(a.id||""),name:a.name||"Activity",type:a.sport_type||a.type||"",date:String(a.start_local||a.start_date_local||"").slice(0,10),
      m:Number(a.summary&&a.summary.distance)||0,s:Number(a.summary&&a.summary.moving_time)||0,elev:Number(a.summary&&a.summary.elevation_gain)||0})).filter(a=>a.date);
    SYNC={state:"ok",at:stored||Date.now()};
    if(S.startVol==null){ // freeze the hybrid block's starting run volume from the 4 weeks before the plan
      const end=[planStart(),monday(TODAY)].sort()[0], from=add(end,-28);
      const mi=ACTS.filter(a=>RUNS.has(a.type)&&a.date>=from&&a.date<end).reduce((t,a)=>t+a.m/MI,0);
      S.startVol=Math.round(mi/4*10)/10; saveSettings();
    }
    renderAll();
    fetchZones(); enrich();
  }catch(e){
    const code=(e&&e.code)||"upstream_error";
    if(AUTHZ.includes(code)) ACTS=[];
    SYNC={state:"err",code,msg:code==="tool_error"?`Strava reported an error: ${e.message||"unknown"}`:"",at:SYNC.at};
    renderAll();
  }
}
async function fetchZones(){
  try{ const p=payload(await callT("get_athlete_zones",{},{cache:{staleTime:300000}}));
    const z=p.heart_rate_zones||(p.heart_rate&&p.heart_rate.zones);
    if(Array.isArray(z)&&z.length>=5){HRZ=z.map(x=>({min:Number(x.min)||0,max:Number(x.max)}));renderAll();}
  }catch(e){}
}
function effortDist(e){
  const n=String(e.name||e.type_value||"").toLowerCase().replace(/[^a-z0-9]/g,""), d=String(e.display_text||"").toLowerCase();
  if(n==="fastest5k"||n==="5k"||d==="5k") return 5000;
  if(n==="fastest10k"||n==="10k"||d==="10k") return 10000;
  if((n.includes("half")&&n.includes("marathon"))||/half.?marathon/.test(d)) return 21097.5;
  return 0;
}
async function enrich(){
  if(ENRICH.status==="loading") return;
  const cut=[add(TODAY,-90),planStart()].sort()[0];
  const todo=ACTS.filter(a=>RUNS.has(a.type)&&a.date>=cut&&a.m>=3000&&!PERF[a.id]).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,45);
  if(!todo.length){ENRICH={status:"ok",done:0,total:0};return;}
  ENRICH={status:"loading",done:0,total:todo.length}; renderAll();
  let i=0, fatal=null, since=0;
  const worker=async()=>{ while(i<todo.length&&!fatal){ const a=todo[i++];
    try{
      const p=payload(await callT("get_activity_performance",{activity_id:a.id},{cache:{staleTime:300000}}));
      const b={}; (p.best_efforts||[]).forEach(e=>{const m=effortDist(e), s=Number(e.value??e.elapsed_time??e.moving_time); if(m&&s>0&&(!b[m]||s<b[m])) b[m]=s;});
      const doc={id:a.id,date:a.date,hr:Number(p.average_heartrate)||0,maxhr:Number(p.max_heartrate)||0,bests:b};
      PERF[a.id]=doc;
      if(DB){ try{ await DB.collection("runs").doc(a.id).set(doc); }catch(e){} }
    }catch(e){ if(e&&AUTHZ.includes(e.code)) fatal=e; }
    ENRICH.done++; if(++since>=6){since=0;renderAll();} } };
  await Promise.all([worker(),worker(),worker()]);
  ENRICH={status:fatal?"err":"ok",done:ENRICH.done,total:ENRICH.total};
  renderAll();
}
function bests(){
  const from=add(TODAY,-90), best={};
  Object.values(PERF).forEach(p=>{ if(!p||p.date<from) return; Object.entries(p.bests||{}).forEach(([m,s])=>{m=Number(m); if(!best[m]||s<best[m].s) best[m]={s,date:p.date,id:p.id};}); });
  let V=0,from_=null; BD.forEach(b=>{const x=best[b.m]; if(!x) return; x.V=vdot(b.m,x.s/60); if(x.V>V){V=x.V;from_=b.m;}});
  return {best,V,from:from_};
}
const runsOn=s=>ACTS.filter(a=>a.date===s&&RUNS.has(a.type));
const actualWeek=i=>{let t=0;for(let d=0;d<7;d++) t+=runsOn(add(weekStart(i),d)).reduce((x,a)=>x+a.m/MI,0);return t;};
const haveData=()=>SYNC.state==="ok";

/* ===================== Storage (artifact database, browser fallback) ===================== */
async function loadStore(){
  try{ DB=window.claude&&window.claude.use?await window.claude.use("db"):null; }catch(e){DB=null;}
  if(!DB) return;
  try{ const d=await DB.doc("settings/plan").get(); if(d.exists){ S={...DEF,...d.data()}; try{localStorage.setItem("mbuild2",JSON.stringify(S));}catch(e){} } }catch(e){}
  try{ const snap=await DB.collection("runs").orderBy("date","desc").limit(500).get(); snap.docs.forEach(d=>{const x=d.data(); if(x&&x.id) PERF[x.id]=x;}); }catch(e){}
  renderAll();
}

  try{localStorage.setItem("mbuild2",JSON.stringify(S));}catch(e){}
  if(DB){ try{ await DB.doc("settings/plan").set({...S}); return "saved"; }catch(e){ return "local"; } }

  else if(st==="err"&&code==="needs_reauth") h=`<h2>Reconnect Strava</h2><p class="muted" style="margin-top:6px">Strava's sign-in has expired.</p>${addSteps("Reconnect")}<div class="row" style="margin-top:12px"><button class="btn primary" id="cnRetry">Check again</button></div>`;

  else if(st==="err"&&code==="approval_required") h=`<h2>Approve Strava</h2><p class="muted" style="margin-top:6px">Strava needs your OK before this page can read it.</p><div class="row" style="margin-top:12px"><button class="btn primary" id="cnRetry">Approve and sync</button></div>`;
  else if(st==="err"&&code==="blocked_by_policy") h=`<h2>Strava is blocked</h2><p class="muted" style="margin-top:6px">Your organization doesn't allow Strava here. The plan works without it.</p>`;
  else if(st==="err") h=`<h2>Strava sync didn't finish</h2><p class="muted" style="margin-top:6px">${esc(SYNC.msg||(code==="server_unavailable"?"Strava didn't respond.":`Something went wrong (${code}).`))} Try again in a minute.</p><div class="row" style="margin-top:12px"><button class="btn primary" id="cnRetry">Try again</button></div>`;
  el.innerHTML=h?`<section class="card connect" style="margin-bottom:12px">${h}</section>`:"";
  const $=id=>document.getElementById(id);
  if($("cnGo")) $("cnGo").onclick=async()=>{ const P=await getPerms(); let r="prompt";
    if(P){ try{ const x=await P.request(["mcp:Strava"]); r=x["mcp:Strava"]||"prompt"; }catch(e){} }
    if(r==="denied"){SYNC={state:"denied"};renderAll();} else sync(true); };

  if($("cnManage")) $("cnManage").onclick=async()=>{ const P=await getPerms();
    try{ await P.manage(); }catch(e){ const h=$("cnHint"); if(h) h.textContent="Open the page's Permissions menu at the top of the artifact and turn Strava on."; return; }
    const s=await P.state("mcp:Strava").catch(()=>"unavailable");
    if(s!=="denied"){SYNC={state:"idle"};sync(true);} };
}

    <div class="spread"><div><div class="eyebrow">Pace source</div><h3 style="margin-top:3px">${strava?"Strava best efforts, last 90 days":"Manual benchmark"}</h3></div>
      <div class="seg" role="group" aria-label="Pace source"><button type="button" id="srcS" class="${strava?"on":""}">Strava</button><button type="button" id="srcM" class="${strava?"":"on"}">Manual</button></div></div>
    ${strava?`<div class="tiles" style="margin-top:12px">${tiles}</div>${status?`<p class="faint" style="margin-top:10px">${status}</p>`:""}`
    :`<form class="form" id="benchForm" style="margin-top:12px">
      <div class="field"><label for="pbDist">Recent race or time trial</label><select id="pbDist">${[["5000","5K"],["10000","10K"],["21097.5","Half marathon"],["42195","Marathon"]].map(([v,n])=>`<option value="${v}" ${S.benchDist===v?"selected":""}>${n}</option>`).join("")}</select></div>
      <div class="field"><label for="pbTime">Finish time</label><input id="pbTime" value="${esc(S.benchTime)}" inputmode="numeric" placeholder="46:00 or 1:42:10"></div>
      <div class="field" style="align-self:end"><button class="btn primary" type="submit">Update paces</button></div>
    </form>`}
  </section>
  <section class="card">
    <div class="eyebrow">Equivalent race times</div>
    <div class="stats" style="margin-top:10px">${races.map(([nm,m])=>{const t=raceT(m,z.V);return `<div class="stat"><div class="l">${nm}</div><div class="v">${fmtH(t)}</div><div class="faint">${fmtP(t/(m/MI))}/mi</div></div>`;}).join("")}</div>
  </section>`;
  document.getElementById("srcS").onclick=async()=>{S.src="strava";await saveSettings();renderAll();};
  document.getElementById("srcM").onclick=async()=>{S.src="manual";await saveSettings();renderAll();};
  const f=document.getElementById("benchForm");
  if(f) f.onsubmit=async e=>{e.preventDefault();
    const t=document.getElementById("pbTime").value.trim(); if(!(parseT(t)>0)) return;
    S.benchDist=document.getElementById("pbDist").value; S.benchTime=t; await saveSettings(); renderAll();};
}
function fmtBench(){return ({"5000":"5K","10000":"10K","21097.5":"half marathon","42195":"marathon"}[S.benchDist]||"benchmark")+" in "+S.benchTime;}

const RESEARCH=`<section class="card">
  <div class="eyebrow">Why it's built this way</div><h2 style="margin-top:3px">The research behind the plan</h2>
  <ul class="cite">
    <li><b>About 80% easy, 20% hard.</b> Elite endurance athletes in every sport spend most of their time at low intensity and keep a few sessions truly hard. Each hybrid week has two hard endurance sessions (Monday run, Thursday ride); everything else is zone 2.<span class="src">Seiler 2010, Int J Sports Physiol Perform; Stöggl &amp; Sperlich 2014, Front Physiol</span></li>
    <li><b>Lift heavy, then add jumps.</b> Heavy strength work (about 3 to 6 reps) and plyometrics improve running economy and late-race durability without adding bulk. The hybrid block moves from higher reps to heavy work to heavy plus jumps, with Olympic-lift variations for power at every stage.<span class="src">Rønnestad &amp; Mujika 2014, Scand J Med Sci Sports; Blagrove et al. 2018, Sports Med; Barnes &amp; Kilding 2015, Sports Med</span></li>
    <li><b>Hard days hard, easy days easy.</b> Lifting and endurance work can blunt each other, and running interferes more than cycling. Lower-body lifts go in the evening of the hard run or ride days, at least 6 hours after them. Upper-body days fall on the easier days, so nothing heavy hits the legs before the long run. Three runs a week leaves room for four lifts.<span class="src">Wilson et al. 2012, J Strength Cond Res; Robineau et al. 2016, J Strength Cond Res</span></li>
    <li><b>The bike builds the engine while sparing your legs.</b> Cycling adds aerobic volume with far less impact than more running. 4 x 4 min intervals at 90 to 95% of max heart rate are among the best-supported ways to raise VO2max.<span class="src">Helgerud et al. 2007, Med Sci Sports Exerc</span></li>
    <li><b>One lift a week holds your strength.</b> During the marathon-specific phase, one heavy session a week kept strength and endurance gains in trained cyclists. That's why lifting drops to one session a week once marathon workouts get big.<span class="src">Rønnestad et al. 2010, Eur J Appl Physiol</span></li>
    <li><b>Three weeks on, one lighter.</b> Every fourth hybrid week cuts volume by about 30%. It ends with a 5K time trial, which Strava turns into a new best effort, so your paces stay current.<span class="src">Standard periodization practice in triathlon and running coaching</span></li>
    <li><b>Winter is for the engine and the gym.</b> From December through February, long runs are capped at about an hour and the extra aerobic time moves to longer indoor rides. Lifting stays at four days a week, which suits the indoor season. Long runs come back with the marathon build, when the weather turns.<span class="src">Castellani et al. 2021, ACSM cold-weather consensus; NWS wind chill chart</span></li>
    <li><b>Fuel the long sessions.</b> Long rides practice taking in 60 to 90 g of carbs an hour, the range endurance guidelines recommend for efforts over 2 hours. On race day that's what keeps you off the wall.<span class="src">Thomas, Erdman &amp; Burke 2016, ACSM/AND/DC position stand</span></li>
  </ul>
</section>`;
function renderPlan(){
  const cw=weekOf(TODAY), n=NW(), maxMi=Math.max(...Array.from({length:n},(_,i)=>weekMi(i)));
  const ph=phases().map(p=>{
    const rows=[];for(let i=p.from;i<=p.to;i++){const mi=weekMi(i), d=buildWeek(i), q=d[1], l=d[5];
      rows.push(`<button class="wkrow${i===cw?" cur":""}" data-w="${i}" type="button"><span class="w">W${i+1}</span><span style="min-width:0"><span class="bar"><i style="width:${mi/maxMi*100}%;background:var(${p.col})"></i></span><span class="faint" style="display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i===n-1?esc(S.raceName)+" · "+fmtD(S.race):blk(i)<0?(()=>{const t=weekLoad(i);return `Bike ${hrs(t.bike)} · swim ${t.swim.toLocaleString()} yd · ${t.lift} lifts · ${l.mi} mi long`;})():`${esc(q.t)} · ${l.mi} mi long`}</span></span><span class="mi">${mi.toFixed(0)} mi</span></button>`);}
    return `<section class="card phase"><div class="spread"><h3>${p.name}</h3><span class="faint">Weeks ${p.from+1}–${p.to+1} · from ${fmtD(weekStart(p.from))}</span></div><p class="muted" style="font-size:.86rem">${p.blurb}</p><div style="margin-top:6px">${rows.join("")}</div></section>`;}).join("");
  view.innerHTML=`
  <section class="card">
    <div class="eyebrow">Your race</div><h2 style="margin-top:3px">Settings</h2>
    <form class="form" id="setForm" style="margin-top:12px">
      <div class="field"><label for="sName">Race</label><input id="sName" value="${esc(S.raceName)}"></div>
      <div class="field"><label for="sDate">Race date</label><input id="sDate" type="date" value="${esc(S.race)}"></div>
      <div class="field"><label for="sGoal">Goal time</label><input id="sGoal" value="${esc(S.goal)}" placeholder="3:29:00"></div>
      <div class="field"><label for="sPeak">Peak week (miles)</label><input id="sPeak" type="number" min="25" max="110" step="1" value="${esc(S.peak)}"><span class="hint">Every week scales from this.</span></div>
      <div class="field"><label for="sStart">Plan start</label><input id="sStart" type="date" value="${esc(S.start)}"><span class="hint">${n} weeks to race day.</span></div>
      <div class="field"><label for="sVol">Starting weekly miles</label><input id="sVol" type="number" min="0" max="110" step="1" value="${S.startVol!=null?esc(Math.round(S.startVol)):""}" placeholder="From Strava"><span class="hint">Set from your last 4 weeks on Strava.</span></div>
      <div class="field"><label for="sWinter">Winter adjustments</label><select id="sWinter">${[["dec-feb","December – February"],["nov-mar","November – March"],["off","Off"]].map(([v,n])=>`<option value="${v}" ${S.winter===v?"selected":""}>${n}</option>`).join("")}</select><span class="hint">Shorter long runs, indoor rides.</span></div>
      <div class="field" style="align-self:end"><button class="btn primary" type="submit">Save plan</button> <span class="faint" id="saved" aria-live="polite"></span></div>
    </form>
  </section>
  ${ph}
  ${RESEARCH}`;
  view.querySelectorAll(".wkrow").forEach(b=>b.onclick=()=>{WK=Number(b.dataset.w);setTab("week");});
  document.getElementById("setForm").onsubmit=async e=>{e.preventDefault();
    const v=id=>document.getElementById(id).value.trim();
    const date=v("sDate"), start=v("sStart"); if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^\d{4}-\d{2}-\d{2}$/.test(start)) return;
    const vol=v("sVol");
    S={...S,raceName:v("sName")||"Marathon",race:date,start,goal:parseT(v("sGoal"))>0?v("sGoal"):S.goal,
      peak:String(clamp(Number(v("sPeak"))||50,25,110)),winter:document.getElementById("sWinter").value,startVol:vol===""?S.startVol:clamp(Number(vol)||0,0,110)};
    const r=await saveSettings(); WK=null;
    renderAll(); const s=document.getElementById("saved"); if(s) s.textContent=r==="saved"?"Saved":"Saved on this device";
  };
}

const RENDER={week:renderWeek,progress:renderProgress,paces:renderPaces,plan:renderPlan};
function setTab(t){TAB=RENDER[t]?t:"week"; try{localStorage.setItem("mbuild-tab",TAB);}catch(e){}
  document.querySelectorAll("#tabbar button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===TAB?"true":"false"));
  RENDER[TAB](); }
function renderAll(){
  renderBar(); renderConnect();
  // keep form edits on the Plan tab from being wiped by background syncs
  if(TAB==="plan"&&view.contains(document.activeElement)&&document.activeElement.tagName==="INPUT") return;
  RENDER[TAB]&&RENDER[TAB]();
}
document.querySelectorAll("#tabbar button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
document.getElementById("sync").onclick=()=>{ if(SYNC.state==="need"){const g=document.getElementById("cnGo"); if(g) g.click(); return;} SYNC={...SYNC,state:SYNC.state==="loading"?"loading":"idle"}; sync(true); };
if(/^#(week|progress|paces|plan)$/.test(location.hash)) TAB=location.hash.slice(1);
if(!RENDER[TAB]) TAB="week";
renderBar(); setTab(TAB);
(async()=>{
  await loadStore();
  const mcp=await getMcp();
  if(!mcp){SYNC={state:"off"};renderAll();return;}
  const P=await getPerms();
  const st=P?await P.state("mcp:Strava").catch(()=>"unavailable"):"unavailable";
  if(st==="denied"){SYNC={state:"denied"};renderAll();}
  else if(st==="prompt"){SYNC={state:"need"};renderAll();}
  else sync(false);
})();
</script>
