<title>Marathon Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a race-bib header over a single column of training cards, tabs pinned under the header like lane markers. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface2:#F5F7F9; --line:#D8DEE5;
  --ink:#16202B; --ink2:#4A5866; --ink3:#7C8896;
  --lane:#1F5BD8; --lane-soft:#E3EBFB;
  --bib:#F2C230; --bib-ink:#1A1608;
  --base:#5E9C7A; --thr:#D98A2B; --spec:#1F5BD8; --taper:#8A6CC9;
  --good:#2E8A57; --warn:#C27A12; --bad:#C2412F;
  --track:#E1E6EC;
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141B; --surface:#161E27; --surface2:#1C2631; --line:#2A3642;
  --ink:#E8EDF2; --ink2:#AAB6C2; --ink3:#7A8794;
  --lane:#6E9BFF; --lane-soft:#1D2B47;
  --bib:#F2C230; --bib-ink:#1A1608;
  --base:#77B892; --thr:#E8A04A; --spec:#6E9BFF; --taper:#AB91E6;
  --good:#5CC48A; --warn:#E8A04A; --bad:#EF7666; --track:#26313C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#161E27; --surface2:#1C2631; --line:#2A3642;
  --ink:#E8EDF2; --ink2:#AAB6C2; --ink3:#7A8794;
  --lane:#6E9BFF; --lane-soft:#1D2B47;
  --bib:#F2C230; --bib-ink:#1A1608;
  --base:#77B892; --thr:#E8A04A; --spec:#6E9BFF; --taper:#AB91E6;
  --good:#5CC48A; --warn:#E8A04A; --bad:#EF7666; --track:#26313C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:760px;margin-inline:auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lane);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;line-height:1.05;text-wrap:balance;margin:0}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.muted{color:var(--ink2)} .faint{color:var(--ink3);font-size:.8rem}
p{margin:0}

/* Bib header */
.bib{margin-top:16px;background:var(--bib);color:var(--bib-ink);border-radius:18px;padding:16px 18px 18px;position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.bib::before,.bib::after{content:"";position:absolute;top:12px;width:9px;height:9px;border-radius:50%;background:var(--bg)}
.bib::before{left:12px}.bib::after{right:12px}
.bib .race{font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding-left:14px}
.bib .count{font-family:var(--f-display);font-weight:800;font-size:clamp(3.2rem,13vw,5rem);line-height:.9;margin-top:6px;font-variant-numeric:tabular-nums}
.bib .count small{font-size:.32em;font-weight:700;letter-spacing:.06em;margin-left:6px;text-transform:uppercase}
.bib .sub{font-size:.88rem;margin-top:6px;font-weight:500}
.sync{margin-top:12px;display:inline-flex;align-items:center;gap:7px;border:1.5px solid rgba(26,22,8,.35);background:transparent;border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:600;color:var(--bib-ink);white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:rgba(26,22,8,.35)}
.sync[data-s="ok"] .dot{background:#2E8A57}.sync[data-s="err"] .dot{background:#C2412F}
.sync[data-s="loading"] .dot{background:#1F5BD8;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;margin-top:4px}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:2px}
.tabbar button{border:0;background:transparent;border-radius:9px;padding:8px 2px;font-size:.82rem;font-weight:600;color:var(--ink2)}
.tabbar button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 12px;font-size:.85rem;font-weight:600}
.btn.primary{background:var(--lane);border-color:var(--lane);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.note{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:.88rem;color:var(--ink2)}
.note b{color:var(--ink);display:block;font-size:.8rem;margin-bottom:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 12px}
.stat .l{font-size:.72rem;color:var(--ink3);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .v small{font-size:.55em;color:var(--ink3);font-weight:600;margin-left:3px}

/* Meter */
.meter{height:10px;background:var(--track);border-radius:99px;overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--lane);border-radius:99px}

/* Today */
.today{display:grid;gap:10px}
.today .what{font-family:var(--f-display);font-size:1.9rem;font-weight:700;line-height:1}
.today .what .num{font-family:var(--f-display)}

/* Week */
.wk-nav{display:flex;align-items:center;gap:8px}
.wk-nav button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:1rem}
.days{display:grid;gap:0;margin-top:8px}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.day:first-child{border-top:0}
.day.is-today{background:var(--lane-soft);margin-inline:-16px;padding-inline:16px;border-radius:10px;border-top-color:transparent}
.day.is-today + .day{border-top-color:transparent}
.dname{font-family:var(--f-display);font-weight:700;font-size:1.1rem;line-height:1}
.dname small{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;color:var(--ink3);margin-top:3px}
.dwork{min-width:0}
.dwork .t{font-weight:600}
.dwork .p{font-size:.82rem;color:var(--ink2)}
.dmi{font-family:var(--f-display);font-weight:700;font-size:1.3rem;text-align:right;font-variant-numeric:tabular-nums}
.dmi small{display:block;font-family:var(--f-body);font-size:.7rem;color:var(--ink3);font-weight:500}
.done{display:inline-flex;gap:6px;align-items:center;margin-top:5px;font-size:.78rem;font-weight:600;border-radius:7px;padding:2px 8px;background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.done.miss{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.done.other{background:var(--surface2);color:var(--ink2)}
.zone{display:inline-block;font-family:var(--f-mono);font-size:.68rem;padding:1px 6px;border-radius:5px;margin-right:6px;vertical-align:1px;color:#fff}
.z-E,.z-L{background:var(--base)}.z-T{background:var(--thr)}.z-I{background:var(--bad)}.z-MP{background:var(--spec)}.z-R{background:var(--bib);color:var(--bib-ink)}.z-X{background:var(--ink3)}

/* Chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink3);font-family:var(--f-mono);font-size:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;padding-right:0}
.scroll{overflow-x:auto}

/* Runs */
.runs{display:grid}
.run{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.run:first-child{border-top:0}
.run .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run .m{text-align:right;font-family:var(--f-mono);font-size:.85rem}

/* Weather */
.wx-now{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.wx-now .tmp{font-family:var(--f-display);font-weight:800;font-size:4rem;line-height:.9}
.verdict{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center}
.hours{display:grid;grid-auto-flow:column;grid-auto-columns:64px;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:10px}
.hr{background:var(--surface2);border-radius:10px;padding:8px 4px;text-align:center;font-size:.78rem}
.hr.best{outline:2px solid var(--good)}
.hr .v{font-family:var(--f-display);font-weight:700;font-size:1.15rem}
.wxday{display:grid;grid-template-columns:70px 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.wxday:first-child{border-top:0}
.wxday .pl{font-size:.78rem;color:var(--ink3)}

/* Plan */
.phase{display:grid;gap:4px}
.wkrow{display:grid;grid-template-columns:42px 1fr 64px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.wkrow:hover{background:var(--surface2)}
.wkrow .w{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.wkrow .bar{height:8px;border-radius:4px;background:var(--track);position:relative;overflow:hidden}
.wkrow .bar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.wkrow .mi{text-align:right;font-family:var(--f-mono);font-size:.85rem}
.wkrow.cur{background:var(--lane-soft)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:.75rem;font-weight:600;color:var(--ink2)}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:8px 10px}
.field .hint{font-size:.72rem;color:var(--ink3)}

.foot{text-align:center;margin-top:24px;font-size:.75rem;color:var(--ink3)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.tabbar button{font-size:.74rem}.day{grid-template-columns:44px 1fr auto;gap:10px}}
</style>

<div class="wrap">
  <header class="bib" id="bib">
    <div>
      <div class="race" id="raceName">Marathon</div>
      <div class="count" id="count">--<small>days</small></div>
      <div class="sub" id="bibSub">Loading your plan</div>
    </div>
    <button class="sync" id="sync" data-s="idle" aria-label="Refresh Strava"><span class="dot"></span><span id="syncTxt">Strava</span></button>
  </header>

  <nav class="tabs" aria-label="Sections">
    <div class="tabbar" role="tablist" id="tabbar">
      <button role="tab" id="tab-week" data-tab="week">Week</button>
      <button role="tab" id="tab-progress" data-tab="progress">Progress</button>
      <button role="tab" id="tab-paces" data-tab="paces">Paces</button>
      <button role="tab" id="tab-weather" data-tab="weather">Weather</button>
      <button role="tab" id="tab-plan" data-tab="plan">Plan</button>
    </div>
  </nav>

  <main class="stack" id="view" role="tabpanel"></main>
  <div class="foot" id="foot">Activity data from your connected Strava account. Weather from AccuWeather.</div>
</div>

<script>
/* ===================== Settings ===================== */
const DAY=864e5, MI=1609.344, NW=18;
const pad=n=>String(n).padStart(2,"0");
const toT=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d);};
const toS=t=>new Date(t).toISOString().slice(0,10);
const add=(s,n)=>toS(toT(s)+n*DAY);
const TODAY=(()=>{const n=new Date();return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`;})();
const fmtD=(s,o={month:"short",day:"numeric"})=>new Date(toT(s)).toLocaleDateString("en-US",{...o,timeZone:"UTC"});
const dow=s=>(new Date(toT(s)).getUTCDay()+6)%7; // Mon=0
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const DEF={
  raceName:"Spring Marathon",
  race:add(TODAY,7*14+ (6-dow(TODAY))), // a Sunday about 14 weeks out until the runner sets a real date
  goal:"3:15:00", benchDist:"10000", benchTime:"44:30", peak:"50",
  wxKey:"2627448", wxName:"Central Park, New York"
};
let S={...DEF};
try{const s=JSON.parse(localStorage.getItem("mbuild")||"null"); if(s) S={...DEF,...s};}catch(e){}

/* ===================== Pace math (Daniels / Gilbert VDOT) ===================== */
const vo2=v=>-4.6+0.182258*v+0.000104*v*v;
const pctMax=t=>0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);
const vdot=(m,t)=>vo2(m/t)/pctMax(t);
const velAt=(f,V)=>{const c=-4.6-f*V;return(-0.182258+Math.sqrt(0.182258**2-4*0.000104*c))/(2*0.000104);};
const raceT=(m,V)=>{let lo=m/450,hi=m/60;for(let k=0;k<60;k++){const mid=(lo+hi)/2;vdot(m,mid)>V?lo=mid:hi=mid;}return(lo+hi)/2;};
const parseT=s=>{const p=String(s).trim().split(":").map(Number);if(!p.length||p.some(isNaN))return NaN;return p.length===3?p[0]*60+p[1]+p[2]/60:p.length===2?p[0]+p[1]/60:p[0];};
const fmtP=min=>{if(!isFinite(min))return"--";let m=Math.floor(min),s=Math.round((min-m)*60);if(s===60){m++;s=0;}return`${m}:${pad(s)}`;};
const fmtH=min=>{const h=Math.floor(min/60),r=min-h*60;let m=Math.floor(r),s=Math.round((r-m)*60);if(s===60){m++;s=0;}return h?`${h}:${pad(m)}:${pad(s)}`:`${m}:${pad(s)}`;};
function Z(){
  const t=parseT(S.benchTime), m=Number(S.benchDist);
  const V=(t>0&&m>0)?vdot(m,t):45;
  const mar=raceT(42195,V), hm=raceT(21097.5,V);
  const g=parseT(S.goal), goalMar=g>0?g:mar;
  const pv=v=>MI/v; // v in m/min → min per mile
  return {V,mar,hm,goalMar,
    predMP:mar/(42195/MI), MP:goalMar/(42195/MI), HM:hm/(21097.5/MI),
    E:[pv(velAt(.66,V)),pv(velAt(.59,V))],
    T:pv(velAt(.86,V)), I:pv(velAt(.975,V))};
}
const ZONES={E:"Easy",L:"Long",MP:"Marathon pace",T:"Threshold",I:"Interval",R:"Race",X:"Rest"};
function zoneTarget(k,z){
  z=z||Z();
  if(k==="E"||k==="L") return `${fmtP(z.E[0])}–${fmtP(z.E[1])}/mi`;
  if(k==="MP"||k==="R") return `${fmtP(z.MP)}/mi`;
  if(k==="T") return `${fmtP(z.T)}/mi`;
  if(k==="I") return `${fmtP(z.I)}/mi`;
  return "";
}

/* ===================== Plan generator ===================== */
const PHASES=[
  {name:"Base",col:"--base",from:0,to:5,blurb:"Mostly easy running, strides and hill sprints. Build the legs before the workouts."},
  {name:"Threshold",col:"--thr",from:6,to:10,blurb:"Tuesday threshold is the key session. Long runs start finishing at marathon pace."},
  {name:"Marathon specific",col:"--spec",from:11,to:14,blurb:"Marathon pace volume peaks. Biggest week lands three weeks out."},
  {name:"Taper",col:"--taper",from:15,to:17,blurb:"Volume drops 40 to 60 percent. Keep some speed so the legs stay sharp."}
];
const phaseOf=i=>PHASES.findIndex(p=>i>=p.from&&i<=p.to);
const VOL=[.55,.6,.66,.55,.7,.75,.78,.84,.7,.88,.92,.94,.97,.8,1,.78,.6,.4];
// [miles at a 50 mi peak, description, zone]
const QW=[
 [6,"Easy + 6 x 20s strides","E"],[6,"Easy + 6 x 20s strides","E"],[6,"Easy + 8 x 10s hill sprints, walk back","E"],
 [5,"Easy + 6 x 20s strides","E"],[7,"Fartlek: 8 x 1 min quick, 1 min easy","E"],[7,"Easy + 8 x 10s hill sprints","E"],
 [7,"3 x 8 min at threshold, 2 min jog","T"],[8,"4 x 8 min at threshold, 2 min jog","T"],[6,"2 x 12 min at threshold, 3 min jog","T"],
 [8,"3 x 12 min at threshold, 2 min jog","T"],[9,"2 x 20 min at threshold, 3 min jog","T"],
 [8,"5 x 1 km at interval pace, 3 min jog","I"],[9,"3 x 2 mi at threshold, 2 min jog","T"],[7,"6 x 800 m at interval pace, 2 min jog","I"],
 [10,"4 x 2 mi at threshold, 2 min jog","T"],[8,"5 x 1 km at interval pace, 2.5 min jog","I"],[7,"3 x 2 mi at marathon pace, 1 min jog","MP"]
];
const LW=[
 [9,"Easy long run","L"],[10,"Easy long run","L"],[11,"Easy long run","L"],[9,"Easy long run","L"],[12,"Easy long run","L"],[13,"Easy long run","L"],
 [13,"Long run, last 2 mi at marathon pace","MP"],[14,"Long run, last 3 mi at marathon pace","MP"],[11,"Easy long run","L"],
 [15,"Long run with 4 mi at marathon pace in the middle","MP"],[16,"Easy long run","L"],
 [16,"Long run with 2 x 4 mi at marathon pace, 1 mi easy between","MP"],[18,"Long run, last 3 mi steady","L"],
 [13,"Long run with 6 mi at marathon pace","MP"],[20,"Long run with 10 mi at marathon pace","MP"],
 [14,"Long run with 6 mi at marathon pace","MP"],[10,"Easy long run","L"]
];
const r5=x=>Math.max(3,Math.round(x*2)/2);
const planStart=()=>add(add(S.race,-dow(S.race)),-(NW-1)*7);
const weekStart=i=>add(planStart(),i*7);
const weekOf=s=>Math.floor((toT(s)-toT(planStart()))/(7*DAY));
const peak=()=>Math.min(110,Math.max(25,Number(S.peak)||50));

function buildWeek(i){
  const k=peak()/50, out=Array.from({length:7},()=>({mi:0,t:"Rest day",z:"X"}));
  if(i===NW-1){
    const ri=dow(S.race), put=(d,v)=>{if(d>=0&&d<7) out[d]=v;};
    put(ri,{mi:26.2,t:S.raceName||"Marathon",z:"R"});
    put(ri-1,{mi:2,t:"Shakeout + 3 strides. Carb load.",z:"E"});
    put(ri-2,{mi:0,t:"Rest. Lay out your race kit.",z:"X"});
    put(ri-3,{mi:3,t:"Easy + 4 strides",z:"E"});
    put(ri-4,{mi:r5(4*Math.min(k,1.2)),t:"Easy run",z:"E"});
    put(ri-5,{mi:r5(6*Math.min(k,1.2)),t:"3 x 1 mi at marathon pace, 2 min jog",z:"MP"});
    put(ri-6,{mi:r5(5*Math.min(k,1.2)),t:"Easy + 6 strides",z:"E"});
    return out;
  }
  const total=peak()*VOL[i], med=phaseOf(i)>=1;
  const q=QW[i], l=LW[i];
  const qMi=r5(q[0]*k), lMi=Math.min(22,r5(l[0]*Math.sqrt(k)));
  // Mon rest, Tue quality, Wed easy, Thu medium/easy, Fri easy, Sat long, Sun recovery
  const flex=[[2,1,"Easy run"],[3,med?1.4:1,med?"Medium-long run, easy":"Easy run"],[4,.8,"Easy + 6 strides"],[6,.8,"Recovery run, very easy"]];
  const wsum=flex.reduce((a,f)=>a+f[1],0), unit=Math.max(0,total-qMi-lMi)/wsum;
  out[0]={mi:0,t:"Rest, or 20 min easy cross-training",z:"X"};
  out[1]={mi:qMi,t:q[1],z:q[2],key:1};
  flex.forEach(([d,wt,t])=>{out[d]={mi:r5(unit*wt),t,z:"E"};});
  out[5]={mi:lMi,t:l[1],z:l[2],key:1};
  if(peak()<35) out[6]={mi:0,t:"Rest day",z:"X"};
  return out;
}
const weekMi=i=>buildWeek(i).reduce((a,d)=>a+d.mi,0);

/* ===================== Strava ===================== */
const RUNS=new Set(["Run","TrailRun","VirtualRun"]);
let ACTS=[], SYNC={state:"idle",msg:"",at:null};
const ERR={
  needs_reauth:"Reconnect Strava in claude.ai Settings > Connectors, then tap Strava to refresh.",
  server_not_connected:"Add Strava in claude.ai Settings > Connectors, then tap Strava to refresh.",
  selection_required:"Choose which Strava account to use when prompted, then refresh.",
  not_in_manifest:"Strava is turned off for this page. Reload the page to allow it.",
  not_granted:"Strava access wasn't granted. Reload the page to allow it.",
  blocked_by_policy:"Your organization blocks Strava here.",
  approval_required:"Strava needs your approval. Tap Strava to try again.",
  server_unavailable:"Strava didn't respond. Try again in a minute."
};
let MCP=null;
const getMcp=async()=>{ if(MCP) return MCP; try{ MCP=window.claude&&window.claude.use?await window.claude.use("mcp"):null; }catch(e){MCP=null;} return MCP; };
const payload=r=>{let p=r&&r.payload; if(typeof p==="string"){try{p=JSON.parse(p);}catch(_){p={};}} return p||{};};

async function sync(refresh){
  const mcp=await getMcp();
  if(!mcp){SYNC={state:"off",msg:"Strava isn't available in this view. The plan works without it."};renderAll();return;}
  SYNC={...SYNC,state:"loading"}; renderBar();
  const since=add(planStart(),-56)+"T00:00:00";
  const opts={cache:refresh?{refresh:true,staleTime:60000}:{staleTime:300000}};
  try{
    let all=[],after=null,pages=0,stored=null;
    do{
      const input={first:100,range_start:since}; if(after) input.after=after;
      let res;
      try{res=await mcp.callTool("Strava","list_activities",input,opts);}
      catch(e){ if(e&&e.retryable&&pages===0){await new Promise(r=>setTimeout(r,(e.retryAfterMs||1500)+Math.random()*800)); res=await mcp.callTool("Strava","list_activities",input,opts);} else throw e; }
      const p=payload(res);
      all=all.concat(p.activities||[]);
      if(res.cache&&res.cache.storedAt&&!stored) stored=res.cache.storedAt;
      after=p.has_next_page?p.end_cursor:null; pages++;
    }while(after&&pages<8);
    ACTS=all.map(a=>({id:String(a.id||""),name:a.name||"Activity",type:a.sport_type||a.type||"",date:String(a.start_local||a.start_date_local||"").slice(0,10),
      m:Number(a.summary&&a.summary.distance)||0,s:Number(a.summary&&a.summary.moving_time)||0,elev:Number(a.summary&&a.summary.elevation_gain)||0})).filter(a=>a.date);
    SYNC={state:"ok",at:stored||Date.now()};
  }catch(e){
    const code=(e&&e.code)||"upstream_error";
    if(["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","selection_required","not_granted"].includes(code)) ACTS=[];
    SYNC={state:"err",code,msg:ERR[code]||(code==="tool_error"?`Strava reported an error: ${e.message||"unknown"}`:`Strava sync failed (${code}). Tap Strava to try again.`),at:SYNC.at};
  }
  renderAll();
}
const runsOn=s=>ACTS.filter(a=>a.date===s&&RUNS.has(a.type));
const otherOn=s=>ACTS.filter(a=>a.date===s&&!RUNS.has(a.type));
const miOn=s=>runsOn(s).reduce((t,a)=>t+a.m/MI,0);
const actualWeek=i=>{let t=0;for(let d=0;d<7;d++) t+=miOn(add(weekStart(i),d));return t;};
const haveData=()=>SYNC.state==="ok";

/* ===================== Weather (AccuWeather connector) ===================== */
const WX_SERVER="AccuWeather®";
let WX={status:"idle"};
const num=v=>{const n=parseFloat(String(v??"").replace(/[^0-9.\-]/g,""));return isFinite(n)?n:null;};
async function fetchWeather(){
  const mcp=await getMcp();
  if(!mcp){WX={status:"off"}; if(TAB==="weather") renderWeather(); return;}
  if(WX.status==="loading") return;
  WX={...WX,status:"loading"}; if(TAB==="weather") renderWeather();
  const q={locationKey:String(S.wxKey||DEF.wxKey),unit:"imperial",lang:"en"};
  const get=async t=>payload(await mcp.callTool(WX_SERVER,t,{queryParams:q},{cache:{staleTime:300000}}));
  try{
    const [cur,hr,dy]=await Promise.all([get("widgets-current-claude"),get("widgets-hourly-claude"),get("widgets-daily-claude")]);
    WX={status:"ok",at:Date.now(),cur:cur.currentConditions||{},aq:cur.currentAirQuality||null,alerts:[...(cur.alerts||[]),...(dy.alerts||[])],
      hours:hr.hourlyForecast||[],days:dy.dailyForecast||[],loc:(cur.location&&cur.location.localizedName)||S.wxName};
  }catch(e){
    const code=e&&e.code;
    WX={status:"err",code,msg:code==="server_not_connected"||code==="needs_reauth"?"Connect AccuWeather in claude.ai Settings > Connectors, then refresh.":code==="not_in_manifest"||code==="not_granted"?"AccuWeather is turned off for this page. Reload to allow it.":code==="tool_error"?"AccuWeather couldn't find that location key. Check it on the Plan tab.":"AccuWeather didn't respond. Try again in a minute."};
  }
  if(TAB==="weather") renderWeather();
}
function heatAdj(t,dp){
  if(t==null||dp==null) return null;
  const s=Math.round(t+dp);
  const T=[[100,0,0,"Ideal"],[110,0,.5,"Great"],[120,.5,1,"Good"],[130,1,2,"Warm, small slowdown"],[140,2,3,"Warm, adjust paces"],[150,3,4.5,"Hot, adjust paces"],[160,4.5,6,"Hot, run by effort"],[170,6,8,"Very hot, easy running only"],[180,8,10,"Dangerous for hard efforts"]];
  for(const r of T) if(s<=r[0]) return {s,lo:r[1],hi:r[2],label:r[3]};
  return {s,lo:10,hi:12,label:"Skip hard running"};
}

let DB=null;
async function loadSettings(){
  try{ DB=window.claude&&window.claude.use?await window.claude.use("db"):null; }catch(e){DB=null;}
  if(!DB) return;
  try{ const d=await DB.doc("settings/plan").get(); if(d.exists){ S={...DEF,...d.data()}; try{localStorage.setItem("mbuild",JSON.stringify(S));}catch(e){} renderAll(); } }catch(e){}
}
async function saveSettings(){
  try{localStorage.setItem("mbuild",JSON.stringify(S));}catch(e){}
  if(DB){ try{ await DB.doc("settings/plan").set({...S}); return "saved"; }catch(e){ return "local"; } }
  return "local";
}

function doneChip(ds,d){
  const runs=runsOn(ds), oth=otherOn(ds);
  let h="";
  if(runs.length){const mi=runs.reduce((a,r)=>a+r.m/MI,0), s=runs.reduce((a,r)=>a+r.s,0);
    h+=`<span class="done">Ran ${mi.toFixed(1)} mi · ${fmtP(s/60/mi)}/mi</span> `;}
  oth.forEach(a=>{h+=`<span class="done other">${esc(a.type.replace(/([a-z])([A-Z])/g,"$1 $2"))} ${Math.round(a.s/60)} min</span> `;});
  if(!runs.length&&haveData()&&d.mi>0&&ds<TODAY) h+=`<span class="done miss">Missed</span>`;
  return h;
}

  return `<section class="card today">
    <div class="spread"><div class="eyebrow">Today · ${fmtD(TODAY,{weekday:"long",month:"short",day:"numeric"})}</div>${phasePill(i)}</div>
    <div class="what">${d.mi?`<span class="num">${d.mi}</span> mi `:""}${esc(d.mi?ZONES[d.z]==="Long"?"long run":ZONES[d.z].toLowerCase():"Rest")}</div>

}

  const rows=days.map((d,k)=>{const ds=add(weekStart(i),k);
    return `<div class="day${ds===TODAY?" is-today":""}">
      <div class="dname">${fmtD(ds,{weekday:"short"})}<small>${fmtD(ds)}</small></div>
      <div class="dwork"><div class="t">${zoneTag(d.z)}${esc(d.t)}</div>

  plans.forEach((pm,i)=>{const x=L+i*bw, ph=PHASES[phaseOf(i)];
    g+=`<rect x="${x+bw*.14}" y="${y(pm)}" width="${bw*.72}" height="${y(0)-y(pm)}" rx="3" fill="var(${ph.col})" fill-opacity="${i===cw?.38:.2}"><title>Week ${i+1}: ${pm.toFixed(1)} mi planned</title></rect>`;

    if(i%2===0||NW<=12) g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${i+1}</text>`;
  });
  if(cw>=0&&cw<NW) g+=`<text x="${L+cw*bw+bw/2}" y="${T-2}" text-anchor="middle" style="fill:var(--lane);font-weight:600">now</text>`;
  const done=acts.slice(0,Math.max(0,Math.min(cw,NW-1))+1).reduce((a,x)=>a+(x||0),0);

    <div class="legend">${PHASES.map(p=>`<span><i style="background:var(${p.col});opacity:.45"></i>${p.name}</span>`).join("")}${haveData()?`<span><i style="background:var(--ink);width:6px"></i>Run (Strava)</span>`:""}</div>

function renderWeather(){
  const head=`<div class="spread"><div><div class="eyebrow">Weather</div><h2 style="margin-top:3px">${esc(WX.loc||S.wxName)}</h2></div><button class="btn" id="wxr">${WX.status==="loading"?"Updating":"Refresh"}</button></div>`;
  if(WX.status==="idle"||(WX.status==="loading"&&!WX.cur)){view.innerHTML=`<section class="card">${head}<p class="muted" style="margin-top:8px">Getting conditions from AccuWeather.</p></section>`; bindWx(); if(WX.status==="idle") fetchWeather(); return;}
  if(WX.status==="off"||(WX.status==="err"&&!WX.cur)){view.innerHTML=`<section class="card">${head}<p class="muted" style="margin-top:8px">${WX.status==="off"?"Weather needs the AccuWeather connector, which isn't available in this view.":esc(WX.msg)}</p></section>`; bindWx(); return;}
  const c=WX.cur, ex=c.extended||{}, t=num(c.temperatureValue??c.temperature), rf=num(c.realFeelValue??c.realFeel), dp=num(ex.dewPoint);
  const adj=heatAdj(t,dp), z=Z();
  const i=weekOf(TODAY), d=i>=0&&i<NW?buildWeek(i)[dow(TODAY)]:null;
  let todayLine="";
  if(d&&d.mi){const base={T:z.T,I:z.I,MP:z.MP,R:z.MP}[d.z];
    todayLine=base&&adj&&adj.hi>0?`Today's ${ZONES[d.z].toLowerCase()} target of ${fmtP(base)}/mi becomes about ${fmtP(base*(1+(adj.lo+adj.hi)/200))}/mi in these conditions. Hold the effort and let the pace give.`
      :`Today: ${esc(d.t)}. ${adj&&adj.hi===0?"Conditions won't cost you anything.":"Run it by effort if it feels hard."}`;}
  const R=34, C=2*Math.PI*R, frac=adj?Math.min(1,Math.max(0,(adj.s-90)/100)):0;
  const col=!adj?"var(--ink3)":adj.s<=120?"var(--good)":adj.s<=150?"var(--warn)":"var(--bad)";
  const dial=`<svg viewBox="0 0 84 84" width="84" height="84" aria-hidden="true"><circle cx="42" cy="42" r="${R}" fill="none" stroke="var(--track)" stroke-width="9"/><circle cx="42" cy="42" r="${R}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" transform="rotate(-90 42 42)" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/><text x="42" y="48" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)" font-family="var(--f-mono)">${adj?adj.s:"--"}</text></svg>`;
  const hrs=(WX.hours||[]).slice(0,12);
  let best=-1,bs=1e9; hrs.forEach((x,k)=>{const tt=num(x.temperatureValue??x.temperature), dd=num(x.extended&&x.extended.dewPoint), pr=num(x.precip)||0, hh=new Date(x.date).getHours(); if(tt==null||hh<5||hh>21) return; const sc=tt+(dd??tt-10)+pr*.8+(tt<35?(35-tt)*1.5:0); if(sc<bs){bs=sc;best=k;}});
  const hours=hrs.map((x,k)=>{const pr=num(x.precip)||0;return `<div class="hr${k===best?" best":""}"><div class="faint">${esc(x.dateTime||"")}</div><div class="v">${esc(x.temperature??"")}</div><div class="faint">${pr>=20?pr+"% rain":"&nbsp;"}</div></div>`;}).join("");
  const days=(WX.days||[]).slice(0,10);
  const planFor=ds=>{const w=weekOf(ds); if(w<0||w>=NW) return ""; const dd=buildWeek(w)[dow(ds)]; return dd.mi?`${dd.mi} mi · ${dd.t}`:"Rest";};
  const rows=days.map(x=>{const ds=String(x.date||"").slice(0,10), pr=Math.max(num(x.day&&x.day.precip)||0,num(x.night&&x.night.precip)||0);
    return `<div class="wxday"><div><b>${ds===TODAY?"Today":esc(x.dayOfWeek||fmtD(ds,{weekday:"short"}))}</b><div class="faint">${esc(x.displayDate||fmtD(ds))}</div></div>
      <div style="min-width:0"><div>${esc((x.day&&(x.day.phrase||x.day.iconPhrase))||"")}${pr>=20?` · ${pr}% rain`:""}</div><div class="pl">${esc(planFor(ds))}</div></div>
      <div class="mono">${esc(x.night&&x.night.temperature)}° / ${esc(x.day&&x.day.temperature)}°</div></div>`;}).join("");
  const alerts=(WX.alerts||[]).map(a=>`<div class="note" style="margin-top:10px"><b>${esc(a.title||a.headline||"Weather alert")}</b>${esc(a.description||a.text||"")}</div>`).join("");
  view.innerHTML=`
  <section class="card">${head}
    <div class="wx-now" style="margin-top:10px"><div class="tmp">${t??"--"}°</div><div><div><b>${esc(c.phrase||"")}</b></div><div class="muted" style="font-size:.85rem">Feels like ${rf??"--"}° · dew point ${dp??"--"}°${ex.humidity?` · humidity ${esc(ex.humidity)}`:""}${ex.wind?` · wind ${esc(ex.wind)}`:""}</div></div></div>
    ${alerts}
    <div class="faint" style="margin-top:10px">AccuWeather. Updated ${new Date(WX.at).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}.</div>
  </section>
  <section class="card">
    <div class="eyebrow">Running conditions</div>
    <div class="verdict" style="margin-top:8px">${dial}<div><h3>${adj?esc(adj.label):"No reading"}</h3><p class="muted" style="font-size:.86rem;margin-top:4px">Temperature plus dew point = ${adj?adj.s:"--"}. ${adj?(adj.hi===0?"No pace adjustment needed.":`Expect roughly ${adj.lo} to ${adj.hi}% slower at the same effort.`):""}</p></div></div>
    ${todayLine?`<div class="note" style="margin-top:12px"><b>For your plan</b>${todayLine}</div>`:""}
  </section>
  ${hours?`<section class="card"><div class="eyebrow">Next 12 hours</div><h3 style="margin-top:3px">${best>=0?`Best window to run: ${esc(hrs[best].dateTime||"")}`:"Hourly"}</h3><div class="hours">${hours}</div></section>`:""}
  ${rows?`<section class="card"><div class="eyebrow">10 days, with your plan</div><div style="margin-top:6px">${rows}</div></section>`:""}`;
  bindWx();
}
function bindWx(){const b=document.getElementById("wxr"); if(b) b.onclick=()=>{WX={...WX,status:WX.cur?"stale":"idle"}; fetchWeather();};}

function renderPlan(){
  const cw=weekOf(TODAY), maxMi=Math.max(...Array.from({length:NW},(_,i)=>weekMi(i)));
  const phases=PHASES.map(p=>{
    const rows=[];for(let i=p.from;i<=p.to;i++){const mi=weekMi(i), d=buildWeek(i), q=d[1], l=d[5];
      rows.push(`<button class="wkrow${i===cw?" cur":""}" data-w="${i}" type="button"><span class="w">W${i+1}</span><span style="min-width:0"><span class="bar"><i style="width:${mi/maxMi*100}%;background:var(${p.col})"></i></span><span class="faint" style="display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i===NW-1?esc(S.raceName)+" "+fmtD(S.race):`${esc(q.t)} · ${l.mi} mi long`}</span></span><span class="mi">${mi.toFixed(0)} mi</span></button>`);}
    return `<section class="card phase"><div class="spread"><h3>${p.name}</h3><span class="faint">Weeks ${p.from+1}–${p.to+1} · from ${fmtD(weekStart(p.from))}</span></div><p class="muted" style="font-size:.86rem">${p.blurb}</p><div style="margin-top:6px">${rows.join("")}</div></section>`;}).join("");
  view.innerHTML=`
  <section class="card">
    <div class="eyebrow">Your race</div><h2 style="margin-top:3px">Settings</h2>
    <form class="form" id="setForm" style="margin-top:12px">
      <div class="field"><label for="sName">Race</label><input id="sName" value="${esc(S.raceName)}"></div>
      <div class="field"><label for="sDate">Race date</label><input id="sDate" type="date" value="${esc(S.race)}"></div>
      <div class="field"><label for="sGoal">Goal time</label><input id="sGoal" value="${esc(S.goal)}" placeholder="3:15:00"></div>
      <div class="field"><label for="sPeak">Peak week (miles)</label><input id="sPeak" type="number" min="25" max="110" step="1" value="${esc(S.peak)}"><span class="hint">Every week scales from this.</span></div>
      <div class="field"><label for="sWx">AccuWeather location key</label><input id="sWx" value="${esc(S.wxKey)}" inputmode="numeric"><span class="hint">2627448 is Central Park, NYC.</span></div>
      <div class="field"><label for="sWxName">Weather location name</label><input id="sWxName" value="${esc(S.wxName)}"></div>
      <div class="field" style="align-self:end"><button class="btn primary" type="submit">Save plan</button> <span class="faint" id="saved" aria-live="polite"></span></div>
    </form>
  </section>
  ${phases}`;
  view.querySelectorAll(".wkrow").forEach(b=>b.onclick=()=>{WK=Number(b.dataset.w);setTab("week");});
  document.getElementById("setForm").onsubmit=async e=>{e.preventDefault();
    const v=id=>document.getElementById(id).value.trim();
    const date=v("sDate"); if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
    const wxChanged=v("sWx")!==S.wxKey;
    S={...S,raceName:v("sName")||"Marathon",race:date,goal:parseT(v("sGoal"))>0?v("sGoal"):S.goal,peak:String(Math.min(110,Math.max(25,Number(v("sPeak"))||50))),wxKey:v("sWx")||DEF.wxKey,wxName:v("sWxName")||"Weather"};
    const r=await saveSettings(); WK=null; if(wxChanged) WX={status:"idle"};
    renderBar(); renderPlan(); const s=document.getElementById("saved"); if(s) s.textContent=r==="saved"?"Saved":"Saved on this device";
    if(SYNC.state==="ok") sync(false);
  };
}

const RENDER={week:renderWeek,progress:renderProgress,paces:renderPaces,weather:renderWeather,plan:renderPlan};
function setTab(t){TAB=RENDER[t]?t:"week"; try{localStorage.setItem("mbuild-tab",TAB);}catch(e){}
  document.querySelectorAll("#tabbar button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===TAB?"true":"false"));
  RENDER[TAB](); }
function renderAll(){renderBar(); RENDER[TAB]&&RENDER[TAB]();}
document.querySelectorAll("#tabbar button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
document.getElementById("sync").onclick=()=>sync(true);
if(/^#(week|progress|paces|weather|plan)$/.test(location.hash)) TAB=location.hash.slice(1);
renderBar(); setTab(TAB);
(async()=>{ await loadSettings(); sync(false); })();
</script>
