<title>Marathon Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a race-bib header over a single column of training cards, tabs pinned under the header like lane markers. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface2:#F5F7F9; --line:#D8DEE5;
  --ink:#16202B; --ink2:#4A5866; --ink3:#7C8896;
  --lane:#1F5BD8; --lane-soft:#E3EBFB;
  --bib:#F2C230; --bib-ink:#1A1608;
  --found:#A88B5C; --h1:#7A8FA3; --h2:#4F8A8B; --h3:#3E6C8A; --base:#5E9C7A; --thr:#D98A2B; --spec:#1F5BD8; --taper:#8A6CC9;
  --good:#2E8A57; --warn:#C27A12; --bad:#C2412F;
  --track:#E1E6EC;
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141B; --surface:#161E27; --surface2:#1C2631; --line:#2A3642;
  --ink:#E8EDF2; --ink2:#AAB6C2; --ink3:#7A8794;
  --lane:#6E9BFF; --lane-soft:#1D2B47;
  --bib:#F2C230; --bib-ink:#1A1608;
  --found:#C4A676; --h1:#8FA3B8; --h2:#6FB0B1; --h3:#6E9CC0; --base:#77B892; --thr:#E8A04A; --spec:#6E9BFF; --taper:#AB91E6;
  --good:#5CC48A; --warn:#E8A04A; --bad:#EF7666; --track:#26313C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#161E27; --surface2:#1C2631; --line:#2A3642;
  --ink:#E8EDF2; --ink2:#AAB6C2; --ink3:#7A8794;
  --lane:#6E9BFF; --lane-soft:#1D2B47;
  --bib:#F2C230; --bib-ink:#1A1608;
  --found:#C4A676; --h1:#8FA3B8; --h2:#6FB0B1; --h3:#6E9CC0; --base:#77B892; --thr:#E8A04A; --spec:#6E9BFF; --taper:#AB91E6;
  --good:#5CC48A; --warn:#E8A04A; --bad:#EF7666; --track:#26313C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:760px;margin-inline:auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lane);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;line-height:1.05;text-wrap:balance;margin:0}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.muted{color:var(--ink2)} .faint{color:var(--ink3);font-size:.8rem}
p{margin:0}

/* Bib header */
.bib{margin-top:16px;background:var(--bib);color:var(--bib-ink);border-radius:18px;padding:16px 18px 18px;position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.bib::before,.bib::after{content:"";position:absolute;top:12px;width:9px;height:9px;border-radius:50%;background:var(--bg)}
.bib::before{left:12px}.bib::after{right:12px}
.bib .race{font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding-left:14px}
.bib .count{font-family:var(--f-display);font-weight:800;font-size:clamp(3.2rem,13vw,5rem);line-height:.9;margin-top:6px;font-variant-numeric:tabular-nums}
.bib .count small{font-size:.32em;font-weight:700;letter-spacing:.06em;margin-left:6px;text-transform:uppercase}
.bib .sub{font-size:.88rem;margin-top:6px;font-weight:500}
.sync{margin-top:12px;display:inline-flex;align-items:center;gap:7px;border:1.5px solid rgba(26,22,8,.35);background:transparent;border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:600;color:var(--bib-ink);white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:rgba(26,22,8,.35)}
.sync[data-s="ok"] .dot{background:#2E8A57}.sync[data-s="err"] .dot{background:#C2412F}
.sync[data-s="loading"] .dot{background:#1F5BD8;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;margin-top:4px}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:2px}
.tabbar button{border:0;background:transparent;border-radius:9px;padding:8px 2px;font-size:.82rem;font-weight:600;color:var(--ink2)}
.tabbar button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 12px;font-size:.85rem;font-weight:600}
.btn.primary{background:var(--lane);border-color:var(--lane);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.note{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:.88rem;color:var(--ink2)}
.note b{color:var(--ink);display:block;font-size:.8rem;margin-bottom:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 12px}
.stat .l{font-size:.72rem;color:var(--ink3);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .v small{font-size:.55em;color:var(--ink3);font-weight:600;margin-left:3px}

/* Meter */
.meter{height:10px;background:var(--track);border-radius:99px;overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--lane);border-radius:99px}

/* Today */
.today{display:grid;gap:10px}
.today .what{font-family:var(--f-display);font-size:1.9rem;font-weight:700;line-height:1}
.today .what .num{font-family:var(--f-display)}

/* Week */
.wk-nav{display:flex;align-items:center;gap:8px}
.wk-nav .btn{white-space:nowrap}
.wk-nav button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:1rem}
.days{display:grid;gap:0;margin-top:8px}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.day:first-child{border-top:0}
.day.is-today{background:var(--lane-soft);margin-inline:-16px;padding-inline:16px;border-radius:10px;border-top-color:transparent}
.day.is-today + .day{border-top-color:transparent}
.dname{font-family:var(--f-display);font-weight:700;font-size:1.1rem;line-height:1}
.dname small{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;color:var(--ink3);margin-top:3px}
.dwork{min-width:0}
.dwork .t{font-weight:600}
.dwork .p{font-size:.82rem;color:var(--ink2)}
.dmi{font-family:var(--f-display);font-weight:700;font-size:1.3rem;text-align:right;font-variant-numeric:tabular-nums}
.dmi small{display:block;font-family:var(--f-body);font-size:.7rem;color:var(--ink3);font-weight:500}
.done{display:inline-flex;gap:6px;align-items:center;margin-top:5px;font-size:.78rem;font-weight:600;border-radius:7px;padding:2px 8px;background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.done.miss{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.done.other{background:var(--surface2);color:var(--ink2)}
.zone{display:inline-block;font-family:var(--f-mono);font-size:.68rem;padding:1px 6px;border-radius:5px;margin-right:6px;vertical-align:1px;color:#fff}
.z-E,.z-L{background:var(--base)}.z-T{background:var(--thr)}.z-I{background:var(--bad)}.z-MP{background:var(--spec)}.z-R{background:var(--bib);color:var(--bib-ink)}.z-X{background:var(--ink3)}.z-TT{background:var(--bib);color:var(--bib-ink)}.z-BIKE{background:#B5562A}.z-SWIM{background:#1D86A8}.z-LIFT{background:#5B4A8B}.z-MOB{background:var(--ink3)}
.sess+.sess{margin-top:7px}
.gbtn{border:1px solid var(--line);background:var(--surface2);border-radius:7px;padding:1px 8px;font-size:.72rem;font-weight:600;color:var(--lane);margin-left:4px;vertical-align:1px}
textarea.icu{display:block;width:100%;min-height:120px;margin-top:6px;font-family:var(--f-mono);font-size:.78rem;border:1px solid var(--line);border-radius:8px;background:var(--surface2);padding:8px}
.ex{margin:3px 0 0;padding-left:18px;font-size:.84rem;color:var(--ink2)}
.ex li{margin:1px 0}
.cite{display:grid;gap:10px;margin:10px 0 0;padding:0;list-style:none}
.cite li{font-size:.88rem;color:var(--ink2)}
.cite b{color:var(--ink)}
.cite .src{display:block;font-size:.76rem;color:var(--ink3)}

/* Chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink3);font-family:var(--f-mono);font-size:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;padding-right:0}
.scroll{overflow-x:auto}

/* Runs */
.runs{display:grid}
.run{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.run:first-child{border-top:0}
.run .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run .m{text-align:right;font-family:var(--f-mono);font-size:.85rem}

/* Plan */
.phase{display:grid;gap:4px}
.wkrow{display:grid;grid-template-columns:42px 1fr 64px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.wkrow:hover{background:var(--surface2)}
.wkrow .w{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.wkrow .bar{height:8px;border-radius:4px;background:var(--track);position:relative;overflow:hidden}
.wkrow .bar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.wkrow .mi{text-align:right;font-family:var(--f-mono);font-size:.85rem}
.wkrow.cur{background:var(--lane-soft)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:.75rem;font-weight:600;color:var(--ink2)}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:8px 10px}
.field .hint{font-size:.72rem;color:var(--ink3)}

.connect{border:2px solid var(--lane);background:var(--lane-soft)}
.connect ol{margin:8px 0 0;padding-left:20px;color:var(--ink2);font-size:.9rem}
.connect a{color:var(--lane);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 12px;font-size:.82rem;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.foot{text-align:center;margin-top:24px;font-size:.75rem;color:var(--ink3)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.tabbar button{font-size:.74rem}.day{grid-template-columns:44px 1fr auto;gap:10px}}
</style>

<div class="wrap">
  <header class="bib" id="bib">
    <div>
      <div class="race" id="raceName">Grandma's Marathon</div>
      <div class="count" id="count">--<small>days</small></div>
      <div class="sub" id="bibSub">Loading your plan</div>
    </div>
    <button class="sync" id="sync" data-s="idle" aria-label="Refresh Strava"><span class="dot"></span><span id="syncTxt">Strava</span></button>
  </header>

  <nav class="tabs" aria-label="Sections">
    <div class="tabbar" role="tablist" id="tabbar">
      <button role="tab" id="tab-week" data-tab="week">Week</button>
      <button role="tab" id="tab-progress" data-tab="progress">Progress</button>
      <button role="tab" id="tab-paces" data-tab="paces">Paces</button>
      <button role="tab" id="tab-plan" data-tab="plan">Plan</button>
    </div>
  </nav>

  <div id="connect"></div>
  <main class="stack" id="view" role="tabpanel"></main>
  <div class="foot">Runs, best efforts and heart rate zones from your connected Strava account.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ===================== Dates ===================== */
const DAY=864e5, MI=1609.344, BLOCK=18;
const pad=n=>String(n).padStart(2,"0");
const toT=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d);};
const toS=t=>new Date(t).toISOString().slice(0,10);
const add=(s,n)=>toS(toT(s)+n*DAY);
const TODAY=(()=>{const n=new Date();return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`;})();
const fmtD=(s,o={month:"short",day:"numeric"})=>new Date(toT(s)).toLocaleDateString("en-US",{...o,timeZone:"UTC"});
const dow=s=>(new Date(toT(s)).getUTCDay()+6)%7; // Mon=0
const monday=s=>add(s,-dow(s));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));

/* ===================== Settings ===================== */
const DEF={raceName:"Grandma's Marathon",race:"2027-06-19",start:"2026-10-12",goal:"3:29:00",peak:"50",
  src:"strava",winter:"boston",poolFrom:"2026-10-19",ftp:"",trips:[{from:"2026-11-25",to:"2026-11-29",where:"Minnesota"},{from:"2026-12-23",to:"2027-01-01",where:"Minnesota"}],benchDist:"10000",benchTime:"46:00",startVol:null};
let S={...DEF};
try{const s=JSON.parse(localStorage.getItem("mbuild3")||"null"); if(s) S={...DEF,...s};}catch(e){}

/* ===================== Pace math (Daniels / Gilbert VDOT) ===================== */
const vo2=v=>-4.6+0.182258*v+0.000104*v*v;
const pctMax=t=>0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);
const vdot=(m,t)=>vo2(m/t)/pctMax(t);
const velAt=(f,V)=>{const c=-4.6-f*V;return(-0.182258+Math.sqrt(0.182258**2-4*0.000104*c))/(2*0.000104);};
const raceT=(m,V)=>{let lo=m/450,hi=m/60;for(let k=0;k<60;k++){const mid=(lo+hi)/2;vdot(m,mid)>V?lo=mid:hi=mid;}return(lo+hi)/2;};
const parseT=s=>{const p=String(s).trim().split(":").map(Number);if(!p.length||p.some(isNaN))return NaN;return p.length===3?p[0]*60+p[1]+p[2]/60:p.length===2?p[0]+p[1]/60:p[0];};
const fmtP=min=>{if(!isFinite(min))return"--";let m=Math.floor(min),s=Math.round((min-m)*60);if(s===60){m++;s=0;}return`${m}:${pad(s)}`;};
const fmtH=min=>{const h=Math.floor(min/60),r=min-h*60;let m=Math.floor(r),s=Math.round((r-m)*60);if(s===60){m++;s=0;}return h?`${h}:${pad(m)}:${pad(s)}`:`${m}:${pad(s)}`;};
const BD=[{m:5000,k:"5K"},{m:10000,k:"10K"},{m:21097.5,k:"Half marathon"}];
function fitness(){
  const b=bests();
  if(S.src==="strava"&&b.V>0) return {V:b.V,from:b.from,strava:true};
  const t=parseT(S.benchTime), m=Number(S.benchDist);
  return {V:(t>0&&m>0)?vdot(m,t):45,strava:false};
}
function Z(){
  const f=fitness(), V=f.V, pv=v=>MI/v;
  const mar=raceT(42195,V), hm=raceT(21097.5,V), g=parseT(S.goal), goalMar=g>0?g:mar;
  const goalMP=goalMar/(42195/MI), Tp=pv(velAt(.86,V));
  return {V,f,mar,hm,goalMar,goalMP,MP:Math.max(goalMP,Tp*1.05),HM:hm/(21097.5/MI),
    E:[pv(velAt(.66,V)),pv(velAt(.59,V))],T:pv(velAt(.86,V)),I:pv(velAt(.975,V))};
}
const ZONES={E:"Easy",L:"Long",MP:"Marathon pace",T:"Threshold",I:"Interval",TT:"Time trial",R:"Race",X:"Rest"};
function zoneTarget(k,z){
  z=z||Z();
  if(k==="E"||k==="L") return `${fmtP(z.E[0])}–${fmtP(z.E[1])}/mi`;
  if(k==="MP"||k==="R") return `${fmtP(z.MP)}/mi`;
  if(k==="T") return `${fmtP(z.T)}/mi`;
  if(k==="I") return `${fmtP(z.I)}/mi`;
  if(k==="TT") return "hard and even, all you can hold";
  return "";
}
function hrTarget(k){
  if(!HRZ) return "";
  const z=n=>HRZ[n]||{}, mx=v=>v>0?v:null;
  if(k==="E"||k==="L") return `HR under ${z(1).max}`;
  if(k==="MP"||k==="R") return `HR ${z(2).min}–${mx(z(2).max)||""}`;
  if(k==="T") return `HR ${z(3).min}–${mx(z(3).max)||""}`;
  if(k==="I"||k==="TT") return `HR ${z(4).min}+`;
  return "";
}

/* ===================== Plan generator ===================== */
const BLOCK_PH=[
  {name:"Base",col:"--base",from:0,to:5,blurb:"Mostly easy running, strides and hill sprints. Build the legs before the workouts."},
  {name:"Threshold",col:"--thr",from:6,to:10,blurb:"Tuesday threshold is the key session. Long runs start finishing at marathon pace."},
  {name:"Marathon specific",col:"--spec",from:11,to:14,blurb:"Marathon pace volume peaks. Biggest week lands three weeks out."},
  {name:"Taper",col:"--taper",from:15,to:17,blurb:"Volume drops 40 to 60 percent. Keep some speed so the legs stay sharp."}
];
const VOL=[.5,.56,.62,.55,.7,.75,.78,.84,.7,.88,.92,.94,.97,.8,1,.78,.6,.4];
const QW=[
 [6,"Easy + 6 x 20s strides","E"],[6,"Easy + 6 x 20s strides","E"],[6,"Easy + 8 x 10s hill sprints, walk back","E"],
 [5,"Easy + 6 x 20s strides","E"],[7,"Fartlek: 8 x 1 min quick, 1 min easy","E"],[7,"Easy + 8 x 10s hill sprints","E"],
 [7,"3 x 8 min at threshold, 2 min jog","T"],[8,"4 x 8 min at threshold, 2 min jog","T"],[6,"2 x 12 min at threshold, 3 min jog","T"],
 [8,"3 x 12 min at threshold, 2 min jog","T"],[9,"2 x 20 min at threshold, 3 min jog","T"],
 [8,"5 x 1 km at interval pace, 3 min jog","I"],[9,"3 x 2 mi at threshold, 2 min jog","T"],[7,"6 x 800 m at interval pace, 2 min jog","I"],
 [10,"4 x 2 mi at threshold, 2 min jog","T"],[8,"5 x 1 km at interval pace, 2.5 min jog","I"],[7,"3 x 2 mi at marathon pace, 1 min jog","MP"]
];
const LW=[
 [9,"Easy long run","L"],[10,"Easy long run","L"],[11,"Easy long run","L"],[9,"Easy long run","L"],[12,"Easy long run","L"],[13,"Easy long run","L"],
 [13,"Long run, last 2 mi at marathon pace","MP"],[14,"Long run, last 3 mi at marathon pace","MP"],[11,"Easy long run","L"],
 [15,"Long run with 4 mi at marathon pace in the middle","MP"],[16,"Easy long run","L"],
 [16,"Long run with 2 x 4 mi at marathon pace, 1 mi easy between","MP"],[18,"Long run, last 3 mi steady","L"],
 [13,"Long run with 6 mi at marathon pace","MP"],[20,"Long run with 10 mi at marathon pace","MP"],
 [14,"Long run with 6 mi at marathon pace","MP"],[10,"Easy long run","L"]
];
const r5=x=>Math.max(3,Math.round(x*2)/2);
const peak=()=>clamp(Number(S.peak)||50,25,110);
const raceMon=()=>monday(S.race);
function planStart(){
  let m=monday(S.start||TODAY); const n=Math.round((toT(raceMon())-toT(m))/(7*DAY))+1;
  if(n>52) m=add(raceMon(),-51*7); if(n<6) m=add(raceMon(),-5*7); return m;
}
const NW=()=>Math.round((toT(raceMon())-toT(planStart()))/(7*DAY))+1;
const weekStart=i=>add(planStart(),i*7);
const weekOf=s=>Math.floor((toT(s)-toT(planStart()))/(7*DAY));
const blk=i=>i-(NW()-BLOCK);
const REC_WEEKS=3; // first weeks of the plan: recovery from the Oct 4 marathon while starting the new job
const HYB_PH=[
  {name:"Hybrid: Rebuild",col:"--h1",blurb:"Three runs, three lifts, two rides and a swim, nearly all easy. Hill strides and short hill reps start fixing the late-race fade. Lifting uses moderate weights, slow lowering and light Olympic-lift technique."},
  {name:"Hybrid: Strength",col:"--h2",blurb:"Heavy lifting at 4 to 6 reps with power cleans, sweet spot rides and hill repeats. A fourth lift is optional in good weeks. Heavy strength is the lifting most linked to better running economy."},
  {name:"Hybrid: Power",col:"--h3",blurb:"Heavy triples, Olympic lifts and jumps, 4 x 4 VO2 rides and run tempos. Indoors for most of it, which suits the Boston winter. This sets up the marathon build."}
];
function phases(){
  const off=NW()-BLOCK, P=[];
  if(off>0){
    const rec=Math.min(REC_WEEKS,off), rest=off-rec, n=Math.ceil(rest/3);
    P.push({name:"Recover and settle in",col:"--found",from:0,to:rec-1,blurb:"Your body is still recovering from the Oct 4 marathon, and you're starting a new job. Short, easy sessions only. Muscle damage and fatigue from a marathon take a couple of weeks to clear, so nothing hard until week 4."});
    HYB_PH.forEach((p,k)=>{const from=rec+k*n, to=Math.min(off-1,rec+(k+1)*n-1); if(from<=to) P.push({...p,from,to});});
  }
  BLOCK_PH.forEach(p=>{const to=p.to+off; if(to>=0) P.push({...p,from:Math.max(0,p.from+off),to});});
  return P;
}
const phaseOf=i=>phases().find(p=>i>=p.from&&i<=p.to)||phases()[0];
const startVol=()=>clamp(Number(S.startVol)||peak()*.45,peak()*.36,peak()*.5);
const REST={mi:0,t:"Rest day",z:"X",x:[]};
const X=(sp,amt,t)=>({sp,amt,t});

function layout(total,q,l,med){
  const out=Array.from({length:7},()=>({...REST,x:[]}));
  const flex=[[2,1,"Easy run"],[3,med?1.4:1,med?"Medium-long run, easy":"Easy run"],[4,.8,"Easy + 6 strides"],[6,.8,"Recovery run, very easy"]];
  const wsum=flex.reduce((a,f)=>a+f[1],0), unit=Math.max(0,total-q.mi-l.mi)/wsum;
  out[0]={mi:0,t:"Rest from running",z:"X",x:[]};
  out[1]={...q,key:1,x:[]};
  flex.forEach(([d,wt,t])=>{out[d]={mi:r5(unit*wt),t,z:"E",x:[]};});
  out[5]={...l,key:1,x:[]};
  if(peak()<35) out[6]={...REST,x:[]};
  return out;
}

/* ---------- Weather (Boston) and holidays ---------- */
// Boston's coldest, iciest and darkest stretch is mid-December to mid-February.
const WINTER_RANGES={"boston":[["12-15","02-15"]],"dec-feb":[["12-01","02-28"]],"nov-mar":[["11-15","03-15"]],"off":[]};
const isWinter=ds=>{const md=ds.slice(5); return (WINTER_RANGES[S.winter]||WINTER_RANGES.boston).some(([a,b])=>a<=b?(md>=a&&md<=b):(md>=a||md<=b));};
const winterWeek=i=>isWinter(add(weekStart(i),5)); // judged by the long-run day
const darkWeek=i=>{const m=Number(weekStart(i).slice(5,7));return m>=11||m<=2;}; // after DST ends, it's dark by about 4:30 pm
function holidayOn(ds){
  const [y,m,d]=ds.split("-").map(Number);
  if(m===12&&d===25) return "Christmas";
  if(m===1&&d===1) return "New Year's Day";
  if(m===11){const first=toS(Date.UTC(y,10,1)), firstThu=1+((3-dow(first)+7)%7); if(d===firstThu+21) return "Thanksgiving";}
  return null;
}
const poolOpen=ds=>!!S.poolFrom&&ds>=S.poolFrom;

/* Hybrid weeks: 3 runs, 3 lifts (a 4th optional in good weeks), 2 rides, 1 swim once you have a pool.
   Weekday sessions stay under about an hour around the new job. Tuesday and Friday are recovery days. */
const LIFTS={
  fullA:"Full body A, light · Goblet squat 3 x 8 · Push-ups 3 x 10 · Romanian deadlift 3 x 8 · One-arm row 3 x 10 · Dead bug and side plank · 10 min mobility",
  fullB:"Full body B, light · Step-ups 3 x 8 · Half-kneeling press 3 x 8 · Kettlebell swings 3 x 12 · Pull-ups (assisted if needed) 3 x 5 · Hang muscle clean, technique 3 x 3 with an empty bar · 10 min mobility",
  lowerA:[
    "Lower A · Mobility warm-up (90/90 hips, ankle rocks) · Hang muscle clean, technique 4 x 3 · Goblet squat 3 x 10 · Romanian deadlift 3 x 10 · Split squat 3 x 8 · Calf raises 3 x 15",
    "Lower A · Hang power clean 5 x 3 · Back squat 4 x 5, heavy · Bulgarian split squat 3 x 6 · Heavy calf raises 3 x 10 · Hip mobility cool-down",
    "Lower A · Power clean 5 x 2 · Back squat 3 x 3, heavy · Box jumps 4 x 3 · Pogo hops 3 x 20 · Hip mobility cool-down"],
  lowerB:[
    "Lower B · Kettlebell swings 4 x 12 · Step-ups 3 x 10 · Single-leg RDL 3 x 8 · Copenhagen plank and side plank · Hip mobility flow",
    "Lower B · Trap-bar deadlift 4 x 5 · Hang power snatch, technique 4 x 3 · Walking lunges 3 x 8 · Nordic curls 3 x 4 · Mobility cool-down",
    "Lower B · Hang power snatch 5 x 2 · Trap-bar jumps 4 x 3 · Romanian deadlift 3 x 4 · Single-leg bounds 3 x 6 each side · Mobility cool-down"],
  upper:[
    "Upper, push + pull · Push-ups 3 x 12 · Pull-ups (assisted if needed) 3 x 6–8 · Half-kneeling press 3 x 10 · One-arm row 3 x 10 · Farmer carries · Shoulder mobility",
    "Upper, push + pull · Bench press 4 x 5 · Weighted pull-ups 4 x 5 · Push press 3 x 4 · Barbell row 3 x 6 · Suitcase carries",
    "Upper, push + pull · Push jerk 5 x 2 · Weighted pull-ups 4 x 3 · Bench press 3 x 3 · Med-ball slams 3 x 5 · Turkish get-ups"],
  extra:[
    "",
    "Optional 4th lift, upper and core · Overhead press 3 x 6 · Chin-ups 3 x 6 · Dips 3 x 8 · Face pulls 3 x 15 · Ab wheel, Pallof press · 15 min mobility flow",
    "Optional 4th lift, upper and core · Med-ball chest pass 4 x 5 · Weighted chin-ups 3 x 4 · Landmine press 3 x 6 · Face pulls · Mobility flow"]
};
const isDeload=i=>{const r=i-REC_WEEKS;return blk(i)<0&&r>=0&&(r+1)%4===0&&i>=REC_WEEKS+3;}; // every 4th week after recovery

function recoveryWeek(i){
  const out=Array.from({length:7},()=>({...REST,x:[]}));
  const ws=weekStart(i), swim=d=>poolOpen(add(ws,d))?[X("swim","20–30 min","Easy swim, any stroke. Great for sore legs.")]:[];
  if(i===0){
    out[0]={mi:0,t:"New job, day one. Rest. A 20 min walk at lunch counts.",z:"X",x:[]};
    out[1]={mi:0,t:"Rest from running",z:"X",x:[X("lift","30 min",LIFTS.fullA),...swim(1)]};
    out[2]={mi:3,t:"First run back since the marathon. Very easy, flat, stop if anything hurts.",z:"E",x:[]};
    out[3]={mi:0,t:"Rest from running",z:"X",x:[X("bike","30 min","Optional easy spin. Just moving the legs.")]};
    out[4]={mi:0,t:"Rest day. End of your first week at work.",z:"X",x:[]};
    out[5]={mi:4,t:"Easy run, conversational the whole way",z:"E",x:[X("lift","30 min",LIFTS.fullB)]};
    out[6]={mi:0,t:"Rest from running",z:"X",x:[X("bike","45–60 min","Easy outdoor ride while October is still nice. Zone 2.")]};
  }else{
    const r=i===1?[4,4,6]:[5,5,8];
    out[0]={mi:r[0],t:i===1?"Easy run":"Easy run + 6 x 20s hill strides",z:"E",x:[X("lift","40 min",LIFTS.fullA)]};
    out[1]={mi:0,t:"Rest from running",z:"X",x:swim(1)};
    out[2]={mi:r[1],t:"Easy run, zone 2",z:"E",x:[X("lift","40 min",i===1?LIFTS.fullB:LIFTS.upper[0])]};
    out[3]={mi:0,t:"Rest from running",z:"X",x:[X("bike",i===1?"45 min":"50 min","Easy ride, zone 2"),...(i===2?[X("lift","40 min",LIFTS.lowerB[0])]:[])]};
    out[4]={mi:0,t:"Rest day",z:"X",x:[]};
    out[5]={mi:r[2],t:"Easy long run",z:"L",key:1,x:[]};
    out[6]={mi:0,t:"Rest from running",z:"X",x:[X("bike",i===1?"60 min":"75 min","Outdoor ride, zone 2, conversational")]};
  }
  return out;
}

function hybridWeek(i){
  if(i<REC_WEEKS) return recoveryWeek(i);
  const F=NW()-BLOCK, j=i-REC_WEEKS, n=Math.ceil((F-REC_WEEKS)/3), ph=Math.min(2,Math.floor(j/n)), w=j-ph*n, frac=F-REC_WEEKS>1?j/(F-REC_WEEKS-1):1;
  const deload=isDeload(i), k=peak()/50, dl=deload?.7:1, ws=weekStart(i);
  const vol=(startVol()+(peak()*.5-startVol())*frac)*(deload?.8:1)*(j===0?.9:1); // first week back to structure eases in
  const min=x=>`${Math.round(x*dl/5)*5} min`;
  const winter=winterWeek(i), dark=darkWeek(i);
  const hol=[0,1,2,3,4,5,6].map(d=>holidayOn(add(ws,d)));
  const fourth=ph>=1&&!deload&&!hol.some(Boolean)&&!(ph===1&&w===0);
  const lift=(key,amt)=>X("lift",deload?"35 min":amt,deload?LIFTS[key][ph].split(" · ")[0]+", light week · 2 sets of each lift · Technique work on the Olympic lifts · Longer mobility":LIFTS[key][ph]);
  const runQ=[
    w%2?"Hills: 6 x 45s up at strong effort, jog down":"Easy + 6 x 20s hill strides",
    w%2?"Hills: 8 x 60s up at hard effort, jog down":"Fartlek: 8 x 1 min quick, 1 min easy",
    w<2?"Tempo: 20 min at threshold":"Tempo: 3 x 10 min at threshold, 2 min jog"][ph];
  const ftpTest=j===0;
  const bikeQ=ftpTest?"FTP test: 20 min warm-up with 3 short efforts, then 20 min as hard as you can hold evenly, 10 min easy. Your FTP is 95% of the 20 min average power. Strava's 133 W is only an estimate."
    :deload?"Easy ride, zone 2, high cadence"
    :["Bike: zone 2 with 6 x 30s high-cadence spin-ups",
      w<3?"Sweet spot: 3 x 12 min at 88–93% FTP, 4 min easy":"Threshold: 2 x 20 min at 95% FTP, 5 min easy",
      "VO2: 4 x 4 min hard (90–95% max HR), 3 min easy"][ph];
  const tm=winter?" Treadmill if it's icy or the wind chill is below 0°F.":dark?" It's dark after work: run before work, at lunch, or wear a headlamp and reflective vest.":"";
  const out=Array.from({length:7},()=>({...REST,x:[]}));
  out[0]=deload&&ph>0?{mi:r5(6*Math.min(k,1.2)),t:"5K time trial: 2 mi warm-up, 5K hard and even, 1 mi cool-down. Strava logs the best effort and your paces update."+tm,z:"TT",key:1,x:[lift("lowerA","45 min")]}
    :{mi:r5(vol*.3),t:runQ+"."+tm,z:ph===2?"T":"E",key:1,x:[lift("lowerA","45 min")]};
  out[1]={mi:0,t:"Rest from running. Recovery day.",z:"X",x:poolOpen(add(ws,1))?[X("swim",deload?"30 min":"30–40 min",["Swim: drills (catch-up, fingertip drag), then easy 100s","Swim: drills, then 8 x 100 yd steady, 20s rest","Swim: drills, then 3 x 400 yd steady"][ph])]:[]};
  out[2]={mi:r5(vol*.28),t:"Easy run, zone 2."+tm,z:"E",x:[lift("upper","40 min")]};
  out[3]={mi:0,t:"Rest from running",z:"X",x:[X("bike",ftpTest?"60 min":min(45+ph*10),(winter||dark?"Indoor trainer. ":"")+bikeQ),lift("lowerB","45 min")]};
  out[4]={mi:0,t:"Rest day",z:"X",x:fourth?[X("lift","40 min",LIFTS.extra[ph]+" · Skip it if work was a lot this week")]:[X("mob","Optional","15 min mobility")]};
  if(winter){
    out[5]={mi:r5(Math.min(vol*.4,7*Math.sqrt(k))),t:"Winter long run, 60–75 min max. Go late morning when it's warmest, start into the wind off the water so it's at your back coming home. Treadmill if it's icy or the wind chill is below 0°F.",z:"L",key:1,x:[]};
    out[6]={mi:0,t:"Rest from running",z:"X",x:[X("bike",min(90+ph*15+w*5),"Indoor long ride on the trainer, zone 2. This covers the aerobic time you're not getting from a long outdoor run."+(ph===2?" Practice fueling at your 75 g carbs per hour.":""))]};
  }else{
    out[5]={mi:r5(Math.min(vol*.4,12*Math.sqrt(k))),t:"Easy long run"+(ph>=1?", rolling or hilly route":"")+"."+(dark?" Weekend daylight is your friend.":""),z:"L",key:1,x:[]};
    out[6]={mi:0,t:"Rest from running",z:"X",x:[X("bike",min(75+ph*15+w*5),(dark?"Outdoor if it's above about 35°F and dry, otherwise the trainer. ":"")+"Long ride, zone 2, conversational")]};
  }
  hol.forEach((h,d)=>{ if(!h) return;
    out[d]= h==="Thanksgiving"
      ?{mi:0,t:"Rest from running",z:"X",x:[X("mob","Optional","Thanksgiving: run a Turkey Trot for fun, or take an easy spin. No lifting today.")]}
      :{mi:0,t:`${h}: rest day. An easy walk with family counts.`,z:"X",x:[]};
  });
  return out;
}

/* Marathon block: strength 2x a week in base, 1x maintenance through the specific phase, tapering off before race week. */
function blockExtras(b,days,i){
  const add_=(d,s)=>{if(days[d]&&!(s.sp==="swim"&&!poolOpen(add(weekStart(i),d)))) days[d].x.push(s);};
  if(b<=5){
    add_(1,X("lift","45 min","PM, 6+ hours after the run. Heavy lower: squat or trap-bar deadlift 3 x 4–6, box jumps 3 x 3, calf raises."));
    add_(3,X("lift","40 min","PM. Single-leg and upper: split squat 3 x 6, single-leg RDL, push and pull 3 x 6."));
    add_(0,X("swim","30 min","Easy swim, technique focus. Recovery only."));
    add_(2,X("bike","30–45 min","Optional easy spin, recovery only."));
  }else if(b<=14){
    add_(1,X("lift","30 min","PM maintenance: squat or trap-bar deadlift 3 x 3 heavy, box jumps 3 x 3. One session a week holds strength."));
    add_(0,X("swim","30 min","Easy swim, recovery only."));
    add_(2,X("bike","30 min","Optional easy spin, recovery only."));
  }else if(b<=16){
    add_(1,X("lift",b===15?"25 min":"15 min",b===15?"Light strength: 2 x 3 at a moderate weight, a few jumps.":"Activation only: bodyweight squats, glute bridges, calf raises."));
    add_(0,X("swim","20 min","Easy swim, loosen up."));
  }
  return days;
}

function buildWeekBase(i){
  const k=peak()/50, b=blk(i);
  if(b<0) return hybridWeek(i);
  if(b===BLOCK-1){
    const out=Array.from({length:7},()=>({...REST,x:[]}));
    const ri=dow(S.race), put=(d,v)=>{if(d>=0&&d<7) out[d]={x:[],...v};}, s=Math.min(k,1.2);
    put(ri,{mi:26.2,t:S.raceName||"Marathon",z:"R"});
    put(ri-1,{mi:2,t:"Shakeout + 3 strides. Carb load: 8–10 g per kg today.",z:"E"});
    put(ri-2,{mi:0,t:"Rest. Lay out your race kit.",z:"X"});
    put(ri-3,{mi:3,t:"Easy + 4 strides",z:"E"});
    put(ri-4,{mi:r5(4*s),t:"Easy run",z:"E"});
    put(ri-5,{mi:r5(6*s),t:"3 x 1 mi at marathon pace, 2 min jog",z:"MP"});
    put(ri-6,{mi:r5(5*s),t:"Easy + 6 strides",z:"E"});
    return out;
  }
  const q=QW[b], l=LW[b];
  const wl=winterWeek(i)?" Winter: treadmill, or split it into a morning and afternoon run if wind chill is below -15°F.":"";
  return blockExtras(b,layout(peak()*VOL[b],{mi:r5(q[0]*k),t:q[1],z:q[2]},{mi:Math.min(22,r5(l[0]*Math.sqrt(k))),t:l[1]+"."+wl,z:l[2]},b>=6),i);
}
/* Trips home to Minnesota: travel days become rest days, no pool, the gym stands in for the trainer, colder rules. */
const tripOn=ds=>(S.trips||[]).find(t=>t&&t.from&&t.to&&ds>=t.from&&ds<=t.to);
const tripWeek=i=>[0,1,2,3,4,5,6].some(d=>tripOn(add(weekStart(i),d)));
function buildWeek(i){
  const base=buildWeekBase(i), lost=[];
  const out=base.map((d,k)=>{
    const ds=add(weekStart(i),k), t=tripOn(ds), h=holidayOn(ds);
    if(!t) return d;
    if(ds===t.from||ds===t.to){ if(d.mi>0&&d.z==="E") lost.push({k,d});
      return {mi:0,t:`${h?h+": t":"T"}ravel day ${ds===t.from?"to":"home from"} ${t.where}. Walk the airport, drink extra water, 10 min of mobility at the gate.`,z:"X",x:[],trip:1,travel:1}; }
    if(h) return d;
    const x=d.x.filter(s=>s.sp!=="swim").map(s=>s.sp==="bike"?{...s,t:"At the gym: spin bike, or elliptical if there's no bike. "+s.t.replace(/^Indoor (long ride on the )?trainer\.? ?|^Outdoor if[^.]*\. /i,"")}:s.sp==="lift"?{...s,t:"At the gym. "+s.t}:s);
    return {...d,t:d.mi>0?d.t.replace(/ Treadmill if[^.]*\.| It's dark after work[^.]*\.|, start into the wind off the water so it's at your back coming home/g,"")+` In ${t.where}: gym treadmill if the wind chill is below 0°F or it's icy.`:d.t,x,trip:1};
  });
  // an easy run lost to a travel day moves to the next free day of the trip
  lost.forEach(({k,d})=>{ for(let j=k+1;j<7;j++){ const ds=add(weekStart(i),j), o=out[j];
    if(o.mi===0&&!o.travel&&!holidayOn(ds)&&tripOn(ds)&&!(out[j+1]&&out[j+1].z==="TT")){ out[j]={...o,mi:d.mi,t:`Easy run, moved from the travel day. Gym treadmill if the wind chill is below 0°F or it's icy.`,z:"E",x:o.x}; break; } } });
  return out;
}
const weekMi=i=>buildWeek(i).reduce((a,d)=>a+d.mi,0);
const parseMin=a=>{const m=String(a).match(/(\d+)(?:–(\d+))?\s*min/);return m?(Number(m[2]||m[1])):0;};

function weekLoad(i){
  const t={bike:0,swim:0,lift:0};
  buildWeek(i).forEach(d=>d.x.forEach(s=>{ if(s.sp==="bike"&&!/Optional/.test(s.t)) t.bike+=parseMin(s.amt); if(s.sp==="swim") t.swim+=parseMin(s.amt); if(s.sp==="lift") t.lift++; }));
  return t;
}

/* ===================== Garmin via intervals.icu workout text ===================== */
// Run targets are % of threshold pace (set threshold pace in intervals.icu to your Threshold pace from the Paces tab).
// Ride targets are % of FTP. intervals.icu turns these into structured workouts and sends them to Garmin.
function icuPct(){
  const z=Z(), p=x=>Math.round(z.T/x*100);
  return {E:`${p(z.E[1])}-${p(z.E[0])}%`,MP:`${p(z.MP)-1}-${p(z.MP)+1}%`,T:"98-102%",I:`${p(z.I)-1}-${p(z.I)+2}%`,R:`${p(z.I)+2}-${p(z.I)+8}%`,J:`${Math.max(55,p(z.E[1])-8)}%`};
}
function icuRun(d){
  const P=icuPct(), t=d.t, E=`${P.E} Pace`, jog=`${P.J} Pace`;
  const wu="Warmup\n- 15m "+E, cd="Cooldown\n- 10m "+E;
  let m;
  const block=(n,body)=>`Main Set ${n}x\n${body}`;
  if(d.z==="TT") return `Warmup\n- 2mi ${E}\n\nStrides 4x\n- 20s ${P.R} Pace\n- 40s ${jog}\n\nTime trial\n- 5km ${P.I} Pace\n\nCooldown\n- 1mi ${E}`;
  if((m=t.match(/(\d+) x (\d+)s (?:up|hill sprints)/))) return `${wu}\n\n${block(m[1],`- ${m[2]}s ${P.R} Pace\n- 2m ${jog}`)}\n\n${cd}`;
  if((m=t.match(/Hills: (\d+) x (\d+)s up/))) return `${wu}\n\n${block(m[1],`- ${m[2]}s ${P.I} Pace\n- 2m ${jog}`)}\n\n${cd}`;
  if((m=t.match(/Fartlek: (\d+) x (\d+) min quick, (\d+) min easy/))) return `${wu}\n\n${block(m[1],`- ${m[2]}m ${P.I} Pace\n- ${m[3]}m ${E}`)}\n\n${cd}`;
  if((m=t.match(/Tempo: (\d+) min at threshold/))) return `${wu}\n\nTempo\n- ${m[1]}m ${P.T} Pace\n\n${cd}`;
  if((m=t.match(/(\d+) x (\d+) min at threshold, (\d+) min jog/))) return `${wu}\n\n${block(m[1],`- ${m[2]}m ${P.T} Pace\n- ${m[3]}m ${jog}`)}\n\n${cd}`;
  if((m=t.match(/(\d+) x (\d+) mi at (threshold|marathon pace), (\d+) min jog/))) return `${wu}\n\n${block(m[1],`- ${m[2]}mi ${m[3]==="threshold"?P.T:P.MP} Pace\n- ${m[4]}m ${jog}`)}\n\n${cd}`;
  if((m=t.match(/(\d+) x 1 km at interval pace, ([\d.]+) min jog/))) return `${wu}\n\n${block(m[1],`- 1km ${P.I} Pace\n- ${m[2]}m ${jog}`)}\n\n${cd}`;
  if((m=t.match(/(\d+) x 800 m at interval pace, (\d+) min jog/))) return `${wu}\n\n${block(m[1],`- 800mtr ${P.I} Pace\n- ${m[2]}m ${jog}`)}\n\n${cd}`;
  if((m=t.match(/(\d+) x 1 mi at marathon pace, (\d+) min jog/))) return `${wu}\n\n${block(m[1],`- 1mi ${P.MP} Pace\n- ${m[2]}m ${jog}`)}\n\n${cd}`;
  if((m=t.match(/last (\d+) mi at marathon pace/))) return `Easy\n- ${Math.max(1,d.mi-m[1])}mi ${E}\n\nFinish at marathon pace\n- ${m[1]}mi ${P.MP} Pace`;
  if((m=t.match(/last (\d+) mi steady/))) return `Easy\n- ${Math.max(1,d.mi-m[1])}mi ${E}\n\nSteady finish\n- ${m[1]}mi ${P.MP} Pace`;
  if((m=t.match(/2 x (\d+) mi at marathon pace, 1 mi easy between/))){const e=Math.max(1,(d.mi-2*m[1]-1)/2);return `Easy\n- ${e}mi ${E}\n\n${block(2,`- ${m[1]}mi ${P.MP} Pace\n- 1mi ${E}`)}\n\nEasy\n- ${e}mi ${E}`;}
  if((m=t.match(/with (\d+) mi at marathon pace/))){const e=Math.max(1,(d.mi-m[1])/2);return `Easy\n- ${e}mi ${E}\n\nMarathon pace\n- ${m[1]}mi ${P.MP} Pace\n\nEasy\n- ${e}mi ${E}`;}
  if(/strides/.test(t)){const n=(t.match(/(\d+) x 20s/)||[0,6])[1];return `Easy\n- ${Math.max(1,d.mi-0.5)}mi ${E}\n\nStrides ${n}x\n- 20s ${P.R} Pace\n- 60s ${jog}`;}
  if(d.z==="R") return `Race\n- 26.2mi ${P.MP} Pace`;
  return `Easy\n- ${d.mi}mi ${E}`;
}
function icuBike(s){

// Minimal FIT encoder for workout files: file_id, workout and workout_step messages.
// Copy the files to the watch's GARMIN/NewFiles folder; they show up under Training > Workouts.
const FIT_CRC=[0x0000,0xCC01,0xD801,0x1400,0xF001,0x3C00,0x2800,0xE401,0xA001,0x6C00,0x7800,0xB401,0x5000,0x9C01,0x8801,0x4400];
function fitCrc(bytes,crc=0){ for(const b of bytes){ let t=FIT_CRC[crc&0xF]; crc=(crc>>4)&0x0FFF; crc=crc^t^FIT_CRC[b&0xF]; t=FIT_CRC[crc&0xF]; crc=(crc>>4)&0x0FFF; crc=crc^t^FIT_CRC[(b>>4)&0xF]; } return crc; }
const FT={enum:[0x00,1],u16:[0x84,2],u32:[0x86,4],u32z:[0x8C,4],str:[0x07,32]};
const FIT_DEFS={
  0:{local:0,fields:[[0,"enum"],[1,"u16"],[2,"u16"],[3,"u32z"],[4,"u32"]]},                // file_id
  26:{local:1,fields:[[4,"enum"],[11,"enum"],[6,"u16"],[8,"str"]]},                      // workout
  27:{local:2,fields:[[254,"u16"],[0,"str"],[1,"enum"],[2,"u32"],[3,"enum"],[4,"u32"],[5,"u32"],[6,"u32"],[7,"enum"],[10,"u16"],[11,"u16"]]} // workout_step
};
function fitEncode(name,sport,subSport,steps){
  const out=[], push=(...b)=>out.push(...b);
  const val=(type,v)=>{
    const [,size]=FT[type];
    if(type==="str"){ const e=new TextEncoder().encode(String(v||"")); const b=new Array(size).fill(0); for(let k=0;k<Math.min(e.length,size-1);k++) b[k]=e[k]; return b; }
    const inv={enum:0xFF,u16:0xFFFF,u32:0xFFFFFFFF,u32z:0}[type];
    let n=v==null?inv:Math.max(0,Math.round(v)); const b=[]; for(let k=0;k<size;k++){ b.push(n&0xFF); n=Math.floor(n/256); } return b;
  };
  const define=g=>{const d=FIT_DEFS[g]; push(0x40|d.local,0,0,g&0xFF,g>>8,d.fields.length); d.fields.forEach(([f,t])=>push(f,FT[t][1],FT[t][0]));};
  const write=(g,vals)=>{const d=FIT_DEFS[g]; push(d.local); d.fields.forEach(([f,t])=>push(...val(t,vals[f])));};
  const now=Math.floor(Date.now()/1000)-631065600;
  define(0); write(0,{0:5,1:255,2:0,3:(now%4000000000)+1,4:now});
  define(26); write(26,{4:sport,11:subSport,6:steps.length,8:name});
  define(27); steps.forEach((s,k)=>write(27,{254:k,...s}));
  const data=Uint8Array.from(out), hdr=[14,0x20,0x54,0x08,data.length&0xFF,(data.length>>8)&0xFF,(data.length>>16)&0xFF,(data.length>>>24)&0xFF,0x2E,0x46,0x49,0x54];
  const hc=fitCrc(hdr); const head=[...hdr,hc&0xFF,hc>>8];
  const all=new Uint8Array(head.length+data.length+2); all.set(head,0); all.set(data,head.length);
  const c=fitCrc(all.subarray(0,head.length+data.length)); all[all.length-2]=c&0xFF; all[all.length-1]=c>>8;
  return all;
}
// workout_step builders. Duration: time in ms (x1000), distance in cm (x100), reps; targets: speed in mm/s, power in W+1000.
const ST={time:0,dist:1,open:5,repeat:6,reps:29}, TG={speed:0,open:2,power:4}, IN={active:0,rest:1,warmup:2,cooldown:3,recovery:4};
const stepOf=(o)=>({0:o.name,1:o.dt,2:o.dv,3:o.tt??TG.open,4:o.tt===undefined||o.tt===TG.open?null:0,5:o.lo,6:o.hi,7:o.int??IN.active,10:o.cat,11:o.ex});

/* Turn the intervals.icu-style text (one source of truth for both exports) into FIT steps. */
function textToSteps(text,kind){
  const z=Z(), thr=MI/(z.T*60), ftp=ftpW();
  const dur=t=>{let m;
    if((m=t.match(/^([\d.]+)mi$/))) return [ST.dist,Number(m[1])*MI*100];
    if((m=t.match(/^([\d.]+)km$/))) return [ST.dist,Number(m[1])*100000];
    if((m=t.match(/^(\d+)mtr$/))) return [ST.dist,Number(m[1])*100];
    if((m=t.match(/^(?:(\d+)m)?(?:(\d+)s)?$/))&&(m[1]||m[2])) return [ST.time,((Number(m[1])||0)*60+(Number(m[2])||0))*1000];
    return [ST.open,null];};
  const tgt=t=>{const m=t.match(/(\d+)(?:-(\d+))?%/); if(!m) return {};
    let a=Number(m[1]), b=Number(m[2]||0); if(!b){a-=3;b=a+6;}
    if(kind==="run") return {tt:TG.speed,lo:thr*a/100*1000,hi:thr*b/100*1000};
    if(ftp) return {tt:TG.power,lo:ftp*a/100+1000,hi:ftp*b/100+1000};
    return {};};
  const steps=[]; let block=null;
  const flush=()=>{ if(!block) return; if(block.rep>1&&block.start<steps.length){ steps.push({name:`Repeat ${block.rep}x`,dt:ST.repeat,dv:block.start,tt:TG.open,int:IN.active,repN:block.rep}); } block=null; };
  text.split("\n").forEach(line=>{
    line=line.trim(); if(!line) return;
    if(!line.startsWith("- ")){ flush(); const m=line.match(/(\d+)x$/); block={title:line.replace(/\s*\d+x$/,""),rep:m?Number(m[1]):1,start:steps.length}; return; }
    const parts=line.slice(2).split(/\s+/), [dt,dv]=dur(parts[0]), tg=tgt(line);
    const ttl=(block&&block.title)||"", inRep=block&&block.rep>1, idx=steps.length-(block?block.start:0);
    const int=/^Warmup/i.test(ttl)?IN.warmup:/^Cooldown/i.test(ttl)?IN.cooldown:inRep&&idx===1?IN.recovery:IN.active;
    steps.push({name:(inRep&&idx===1?"Recover":ttl||"Run").slice(0,31),dt,dv,...tg,int});
  });
  flush();
  return steps.map(s=>{const o=stepOf(s); if(s.dt===ST.repeat){o[4]=s.repN;} return o;});
}

  [/calf raises/i,1,18],[/hang (?:muscle|power) clean/i,18,0],[/power clean/i,18,2],[/hang power snatch/i,18,6],[/push jerk/i,18,15],
  [/kettlebell swings/i,12,null],[/step-ups/i,28,66],[/walking lunges/i,17,78],[/nordic curls/i,15,null],[/box jumps/i,20,33],
  [/pogo hops|single-leg bounds/i,20,null],[/med-ball slams/i,20,25],[/med-ball chest pass/i,20,null],[/weighted push-ups|dips or weighted push-ups/i,30,2],
  [/push-ups/i,22,77],[/dumbbell bench/i,0,6],[/bench press|bench or push-ups/i,0,1],[/half-kneeling press/i,24,24],[/overhead press/i,24,14],
  [/push press/i,24,3],[/landmine press/i,24,null],[/face pulls/i,23,5],[/barbell row/i,23,45],[/one-arm row|rows/i,23,13],
  [/weighted chin-ups/i,21,41],[/chin-ups/i,21,39],[/weighted pull-ups/i,21,24],[/pull-ups|pull and push|push and pull/i,21,38],[/dips/i,30,2],

  [/side plank/i,19,66],[/copenhagen/i,19,null]

function liftSteps(text){
  const steps=[]; const items=text.split(" · ").slice(1);
  items.forEach(it=>{
    const m=it.match(/^(.*?)\s(\d+)\s*x\s*(\d+)(?:–(\d+))?(\s*m\b)?/);
    const nm=(m?m[1]:it).replace(/^(Core|Olympic technique):\s*/i,"").replace(/\s*\(.*?\)/g,"").trim();
    const ex=EX.find(([re])=>re.test(nm));
    if(!m){ steps.push(stepOf({name:nm.slice(0,31),dt:ST.open,int:/cool-down/i.test(nm)?IN.cooldown:/mobility|warm-up/i.test(nm)?IN.warmup:IN.active,cat:ex?ex[1]:null,ex:ex?ex[2]:null})); return; }
    const sets=Number(m[2]), reps=Number(m[4]||m[3]), dist=!!m[5], heavy=/heavy|clean|snatch|jerk|squat|deadlift|bench/i.test(it), start=steps.length;
    steps.push(stepOf({name:nm.slice(0,31),dt:dist?ST.open:ST.reps,dv:dist?null:reps,int:IN.active,cat:ex?ex[1]:null,ex:ex?ex[2]:null}));
    steps.push(stepOf({name:"Rest",dt:ST.time,dv:(heavy?120:75)*1000,int:IN.rest}));
    if(sets>1){ const r=stepOf({name:`${sets} sets`,dt:ST.repeat,dv:start}); r[4]=sets; steps.push(r); }
  });

}

    if(d.mi>0){ const nm=`${fmtD(ds)} ${short(d.t)}`.slice(0,31); files.push({name:`${tag}_Run.fit`,bytes:fitEncode(nm,...SPORT.run,textToSteps(icuRun(d),"run"))}); }

  const $=id=>document.getElementById(id);

const targetLine=(d,z)=>{const hr=hrTarget(d.z), p=zoneTarget(d.z,z);return [p,hr].filter(Boolean).join(" · ");};

}

function renderPaces(){
  const z=Z(), b=bests(), races=[["5K",5000],["10K",10000],["Half marathon",21097.5],["Marathon",42195]];
  const km=p=>fmtP(p/1.609344), gap=z.goalMar-z.mar, strava=S.src==="strava";
  const src=z.f.strava?`your Strava ${BD.find(x=>x.m===z.f.from).k} best of ${fmtH(b.best[z.f.from].s/60)} (${fmtD(b.best[z.f.from].date)})`:`your ${fmtBench()}`;
  const rows=[
    ["E","Easy and long runs",`${fmtP(z.E[0])}–${fmtP(z.E[1])}`,`${km(z.E[0])}–${km(z.E[1])}`,"Conversational. Most of your miles."],
    ["MP",z.MP>z.goalMP+1/60?"Marathon pace (training)":"Marathon pace (goal)",fmtP(z.MP),km(z.MP),z.MP>z.goalMP+1/60?`Goal pace is ${fmtP(z.goalMP)}/mi, faster than your current fitness supports. Train at ${fmtP(z.MP)} and it moves toward goal pace as your time trials improve.`:`Goal ${S.goal}. Long-run segments and race day.`],
    ["T","Threshold",fmtP(z.T),km(z.T),"Comfortably hard, about one-hour race effort."],
    ["I","Interval",fmtP(z.I),km(z.I),"About 5K race effort, 3 to 5 minute reps."]
  ].map(r=>`<tr><td>${zoneTag(r[0])}${r[1]}<div class="faint">${r[4]}${hrTarget(r[0])?` · ${hrTarget(r[0])}`:""}</div></td><td class="num mono">${r[2]}</td><td class="num mono">${r[3]}</td></tr>`).join("");
  const tiles=BD.map(x=>{const e=b.best[x.m];return `<div class="stat"><div class="l">${x.k}</div><div class="v">${e?fmtH(e.s/60):"--"}</div><div class="faint">${e?`${fmtD(e.date)} · VDOT ${e.V.toFixed(1)}`:"None in 90 days"}</div></div>`;}).join("");
  const status=ENRICH.status==="loading"?`Reading best efforts from your runs (${ENRICH.done} of ${ENRICH.total}).`:!haveData()?"Connect Strava to use your recent best efforts.":b.V?"":"No 5K, 10K or half marathon best efforts in the last 90 days. Your next time trial will fill this in.";
  view.innerHTML=`
  <section class="card">
    <div class="eyebrow">Fitness · VDOT ${z.V.toFixed(1)}</div>
    <h2 style="margin-top:3px">You're on track for a ${fmtH(z.mar)} marathon</h2>
    <p class="muted" style="margin-top:8px">Based on ${esc(src)}. ${Math.abs(gap)<1.5?`That matches your ${esc(S.goal)} goal.`:gap<0?`Your ${esc(S.goal)} goal is ${fmtH(-gap)} faster than that. The build is there to close the gap; time trials will show if it's closing.`:`Your ${esc(S.goal)} goal is ${fmtH(gap)} slower than that, which leaves room for heat, hills and a bad patch.`}</p>
  </section>
  <section class="card">
    <div class="eyebrow">Training paces${HRZ?" and Strava heart rate zones":""}</div>
    <div class="scroll" style="margin-top:8px"><table class="tbl"><thead><tr><th>Zone</th><th class="num">/mi</th><th class="num">/km</th></tr></thead><tbody>${rows}</tbody></table></div>
  </section>
  <section class="card">
    <div class="spread"><div><div class="eyebrow">Pace source</div><h3 style="margin-top:3px">${strava?"Strava best efforts, last 90 days":"Manual benchmark"}</h3></div>
      <div class="seg" role="group" aria-label="Pace source"><button type="button" id="srcS" class="${strava?"on":""}">Strava</button><button type="button" id="srcM" class="${strava?"":"on"}">Manual</button></div></div>
    ${strava?`<div class="tiles" style="margin-top:12px">${tiles}</div>${status?`<p class="faint" style="margin-top:10px">${status}</p>`:""}`
    :`<form class="form" id="benchForm" style="margin-top:12px">
      <div class="field"><label for="pbDist">Recent race or time trial</label><select id="pbDist">${[["5000","5K"],["10000","10K"],["21097.5","Half marathon"],["42195","Marathon"]].map(([v,n])=>`<option value="${v}" ${S.benchDist===v?"selected":""}>${n}</option>`).join("")}</select></div>
      <div class="field"><label for="pbTime">Finish time</label><input id="pbTime" value="${esc(S.benchTime)}" inputmode="numeric" placeholder="46:00 or 1:42:10"></div>
      <div class="field" style="align-self:end"><button class="btn primary" type="submit">Update paces</button></div>
    </form>`}
  </section>
  <section class="card">
    <div class="eyebrow">Equivalent race times</div>
    <div class="stats" style="margin-top:10px">${races.map(([nm,m])=>{const t=raceT(m,z.V);return `<div class="stat"><div class="l">${nm}</div><div class="v">${fmtH(t)}</div><div class="faint">${fmtP(t/(m/MI))}/mi</div></div>`;}).join("")}</div>
  </section>`;
  document.getElementById("srcS").onclick=async()=>{S.src="strava";await saveSettings();renderAll();};
  document.getElementById("srcM").onclick=async()=>{S.src="manual";await saveSettings();renderAll();};
  const f=document.getElementById("benchForm");
  if(f) f.onsubmit=async e=>{e.preventDefault();
    const t=document.getElementById("pbTime").value.trim(); if(!(parseT(t)>0)) return;
    S.benchDist=document.getElementById("pbDist").value; S.benchTime=t; await saveSettings(); renderAll();};
}
function fmtBench(){return ({"5000":"5K","10000":"10K","21097.5":"half marathon","42195":"marathon"}[S.benchDist]||"benchmark")+" in "+S.benchTime;}

const RESEARCH=`<section class="card">
  <div class="eyebrow">Why it's built this way</div><h2 style="margin-top:3px">The research behind the plan</h2>
  <ul class="cite">
    <li><b>About 80% easy, 20% hard.</b> Elite endurance athletes in every sport spend most of their time at low intensity and keep a few sessions truly hard. Each hybrid week has two hard endurance sessions, the Monday run and the Thursday ride. Everything else is zone 2.<span class="src">Seiler 2010, Int J Sports Physiol Perform; Stöggl &amp; Sperlich 2014, Front Physiol</span></li>
    <li><b>Lift heavy, then add jumps.</b> Heavy strength work (about 3 to 6 reps) and plyometrics improve running economy and late-race durability without adding bulk. The hybrid block moves from higher reps to heavy work to heavy plus jumps, with Olympic-lift variations for power at every stage.<span class="src">Rønnestad &amp; Mujika 2014, Scand J Med Sci Sports; Blagrove et al. 2018, Sports Med; Barnes &amp; Kilding 2015, Sports Med</span></li>
    <li><b>Hard days hard, easy days easy.</b> Lifting and endurance work can blunt each other, and running interferes more than cycling. Lower-body lifts go on the hard run and ride days, so Tuesday and Friday stay true recovery days and nothing heavy hits the legs before the long run. Lifting right after the session is fine on busy work days; a longer gap is better when you can manage it.<span class="src">Wilson et al. 2012, J Strength Cond Res; Robineau et al. 2016, J Strength Cond Res</span></li>
    <li><b>The bike builds the engine while sparing your legs.</b> Cycling adds aerobic volume with far less impact than more running. 4 x 4 min intervals at 90 to 95% of max heart rate are among the best-supported ways to raise VO2max.<span class="src">Helgerud et al. 2007, Med Sci Sports Exerc</span></li>
    <li><b>One lift a week holds your strength.</b> During the marathon-specific phase, one heavy session a week kept strength and endurance gains in trained cyclists. That's why lifting drops to one session a week once marathon workouts get big.<span class="src">Rønnestad et al. 2010, Eur J Appl Physiol</span></li>
    <li><b>Three weeks on, one lighter.</b> Every fourth hybrid week cuts volume by about 30%. It ends with a 5K time trial, which Strava turns into a new best effort, so your paces stay current.<span class="src">Standard periodization practice in triathlon and running coaching</span></li>
    <li><b>Recover from Portland first.</b> A marathon leaves muscle damage and fatigue that take a couple of weeks to clear. Weeks 1 to 3 are short, easy sessions only, which also suits starting a new job. Hard running starts in week 4.<span class="src">Standard post-marathon practice; your Oct 4 race on Strava</span></li>
    <li><b>Fix the fade.</b> In Portland you ran miles 2 to 15 at 8:15 to 8:45 and slowed to 9:30 to 10:40 after mile 16. Durability comes from aerobic volume, strength work and hills, which is why hill strides and hill repeats show up in the Rebuild and Strength phases.<span class="src">Your Oct 4 laps on Strava; Blagrove et al. 2018</span></li>
    <li><b>Winter in Boston is for the engine and the gym.</b> From mid-December to mid-February, the coldest, iciest and darkest stretch, long runs are capped at 60 to 75 minutes and the extra aerobic time moves to indoor rides. Long runs come back in the marathon build as the weather turns.<span class="src">Castellani et al. 2021, ACSM cold-weather consensus; NWS wind chill chart</span></li>
    <li><b>Fuel the long sessions.</b> Long rides practice taking in 60 to 90 g of carbs an hour, the range endurance guidelines recommend for efforts over 2 hours. On race day that's what keeps you off the wall.<span class="src">Thomas, Erdman &amp; Burke 2016, ACSM/AND/DC position stand</span></li>
  </ul>
</section>`;
function garminCard(){
  const z=Z();
  return `<section class="card">
  <div class="eyebrow">Garmin</div><h2 style="margin-top:3px">Get workouts on your watch</h2>
  <ol class="cite" style="list-style:decimal;padding-left:20px">
    <li><b>Download a week.</b> On the Week tab, tap <b>Download week</b> (or <b>Next 4 weeks</b>) and unzip the file. Each run, ride and lift is its own workout file.</li>
    <li><b>Copy them to the watch.</b> Plug your Forerunner into a computer and copy the .fit files into the <span class="mono">GARMIN/NewFiles</span> folder. On a Mac, the watch shows up through OpenMTP or Android File Transfer, not Finder. Unplug, and the workouts appear under Training › Workouts.</li>
    <li><b>Start the workout.</b> Runs guide you with pace ranges (threshold ${fmtP(z.T)}/mi), rides with watts (FTP ${ftpW()||"not set yet"}${ftpW()?" W":""}), and lifts step through each set with rest timers.</li>
    <li><b>Lifts log themselves.</b> Lift files use Garmin's own exercise names, so a Strength activity started from the workout records real sets. Add the weights in the Garmin Connect app afterward, and they sync to Strava and show up here.</li>
  </ol>
  <p class="faint" style="margin-top:10px">Download again after a time trial or an FTP test, since targets come from your current paces and FTP. Copy for Garmin still works if you use intervals.icu.</p>
</section>`;
}
function renderPlan(){
  const cw=weekOf(TODAY), n=NW(), maxMi=Math.max(...Array.from({length:n},(_,i)=>weekMi(i)));
  const ph=phases().map(p=>{
    const rows=[];for(let i=p.from;i<=p.to;i++){const mi=weekMi(i), d=buildWeek(i), q=d[1], l=d[5];
      rows.push(`<button class="wkrow${i===cw?" cur":""}" data-w="${i}" type="button"><span class="w">W${i+1}</span><span style="min-width:0"><span class="bar"><i style="width:${mi/maxMi*100}%;background:var(${p.col})"></i></span><span class="faint" style="display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i===n-1?esc(S.raceName)+" · "+fmtD(S.race):blk(i)<0?(()=>{const t=weekLoad(i);return `Bike ${hrs(t.bike)}${t.swim?` · swim ${hrs(t.swim)}`:""} · ${t.lift} lifts · ${l.mi} mi long`;})():`${esc(q.t)} · ${l.mi} mi long`}</span></span><span class="mi">${mi.toFixed(0)} mi</span></button>`);}
    return `<section class="card phase"><div class="spread"><h3>${p.name}</h3><span class="faint">Weeks ${p.from+1}–${p.to+1} · from ${fmtD(weekStart(p.from))}</span></div><p class="muted" style="font-size:.86rem">${p.blurb}</p><div style="margin-top:6px">${rows.join("")}</div></section>`;}).join("");
  view.innerHTML=`
  <section class="card">
    <div class="eyebrow">Your race</div><h2 style="margin-top:3px">Settings</h2>
    <form class="form" id="setForm" style="margin-top:12px">
      <div class="field"><label for="sName">Race</label><input id="sName" value="${esc(S.raceName)}"></div>
      <div class="field"><label for="sDate">Race date</label><input id="sDate" type="date" value="${esc(S.race)}"></div>
      <div class="field"><label for="sGoal">Goal time</label><input id="sGoal" value="${esc(S.goal)}" placeholder="3:29:00"></div>
      <div class="field"><label for="sPeak">Peak week (miles)</label><input id="sPeak" type="number" min="25" max="110" step="1" value="${esc(S.peak)}"><span class="hint">Every week scales from this.</span></div>
      <div class="field"><label for="sStart">Plan start</label><input id="sStart" type="date" value="${esc(S.start)}"><span class="hint">${n} weeks to race day.</span></div>
      <div class="field"><label for="sVol">Starting weekly miles</label><input id="sVol" type="number" min="0" max="110" step="1" value="${S.startVol!=null?esc(Math.round(S.startVol)):""}" placeholder="From Strava"><span class="hint">Set from your last 4 weeks on Strava.</span></div>
      <div class="field"><label for="sWinter">Winter adjustments</label><select id="sWinter">${[["boston","Boston: mid-Dec – mid-Feb"],["dec-feb","December – February"],["nov-mar","Mid-Nov – mid-Mar"],["off","Off"]].map(([v,n])=>`<option value="${v}" ${S.winter===v?"selected":""}>${n}</option>`).join("")}</select><span class="hint">Shorter long runs, indoor rides.</span></div>
      <div class="field"><label for="sT1">Trip 1 to Minnesota</label><div class="row" style="flex-wrap:nowrap"><input id="sT1" type="date" value="${esc((S.trips[0]||{}).from||"")}" aria-label="Trip 1 start"><input id="sT1b" type="date" value="${esc((S.trips[0]||{}).to||"")}" aria-label="Trip 1 end"></div><span class="hint">Thanksgiving. Leave blank if you're not going.</span></div>
      <div class="field"><label for="sT2">Trip 2 to Minnesota</label><div class="row" style="flex-wrap:nowrap"><input id="sT2" type="date" value="${esc((S.trips[1]||{}).from||"")}" aria-label="Trip 2 start"><input id="sT2b" type="date" value="${esc((S.trips[1]||{}).to||"")}" aria-label="Trip 2 end"></div><span class="hint">Christmas and New Year's.</span></div>
      <div class="field"><label for="sPool">Pool access from</label><input id="sPool" type="date" value="${esc(S.poolFrom||"")}"><span class="hint">Swims show from this date. Clear it if you don't have a pool yet.</span></div>
      <div class="field"><label for="sFtp">Bike FTP (watts)</label><input id="sFtp" type="number" min="50" max="500" value="${esc(S.ftp||"")}" placeholder="${FTP?FTP.w+" from Strava"+(FTP.est?" (estimate)":""):"From Strava"}"><span class="hint">Sets the watts on bike workouts. Test it in week 4.</span></div>
      <div class="field" style="align-self:end"><button class="btn primary" type="submit">Save plan</button> <span class="faint" id="saved" aria-live="polite"></span></div>
    </form>
  </section>
  ${ph}
  ${garminCard()}
  ${RESEARCH}`;
  view.querySelectorAll(".wkrow").forEach(b=>b.onclick=()=>{WK=Number(b.dataset.w);setTab("week");});
  document.getElementById("setForm").onsubmit=async e=>{e.preventDefault();
    const v=id=>document.getElementById(id).value.trim();
    const date=v("sDate"), start=v("sStart"); if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^\d{4}-\d{2}-\d{2}$/.test(start)) return;
    const vol=v("sVol");
    S={...S,raceName:v("sName")||"Marathon",race:date,start,goal:parseT(v("sGoal"))>0?v("sGoal"):S.goal,
      peak:String(clamp(Number(v("sPeak"))||50,25,110)),winter:document.getElementById("sWinter").value,poolFrom:document.getElementById("sPool").value,ftp:document.getElementById("sFtp").value.trim(),trips:[[v("sT1"),v("sT1b")],[v("sT2"),v("sT2b")]].filter(([a,b])=>a&&b&&a<=b).map(([from,to])=>({from,to,where:"Minnesota"})),startVol:vol===""?S.startVol:clamp(Number(vol)||0,0,110)};
    const r=await saveSettings(); WK=null;
    renderAll(); const s=document.getElementById("saved"); if(s) s.textContent=r==="saved"?"Saved":"Saved on this device";
  };
}

const RENDER={week:renderWeek,progress:renderProgress,paces:renderPaces,plan:renderPlan};
function setTab(t){TAB=RENDER[t]?t:"week"; try{localStorage.setItem("mbuild-tab",TAB);}catch(e){}
  document.querySelectorAll("#tabbar button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===TAB?"true":"false"));
  ICU=[]; RENDER[TAB](); bindGarmin(); }
let DL=null;
const getDl=async()=>{ if(DL!==null) return DL; try{ DL=window.claude&&window.claude.use?await window.claude.use("downloads"):null; }catch(e){DL=null;} return DL; };
async function downloadWeeks(from,count,btn,status){
  const dl=await getDl(), say=t=>{ if(status) status.textContent=t; };
  if(!dl){ say("Downloads aren't available in this view. Open the dashboard in claude.ai or the Claude app."); return; }
  if(!window.JSZip){ say("The zip tool didn't load. Reload the page and try again."); return; }
  btn.disabled=true; say("Building workout files");
  try{
    const zip=new JSZip(); let n=0;
    for(let i=from;i<Math.min(NW(),from+count);i++) weekFitFiles(i).forEach(f=>{zip.file(f.name,f.bytes);n++;});
    if(!n){ say("No runs, rides or lifts in those weeks."); return; }
    const data=await zip.generateAsync({type:"uint8array"});
    const last=Math.min(NW(),from+count)-1;
    const r=await dl.save({filename:`Garmin workouts ${count>1?`weeks ${from+1}-${last+1}`:`week ${from+1}`}.zip`,data,request:`${n} Garmin workout files for ${count>1?`weeks ${from+1} to ${last+1}`:`week ${from+1}`}`});
    say(`Saved ${n} workouts. Unzip and copy the .fit files to GARMIN/NewFiles on your watch.`);
  }catch(e){
    const c=e&&e.code;
    say(c==="declined"?"Download canceled.":c==="rejected_extension"||c==="extension_not_enabled"?"This view doesn't allow .zip downloads.":c==="too_large"?"That's too many workouts at once. Try one week.":c==="rate_limited"?"Too many downloads in a row. Try again in a minute.":"The download didn't work. Try again.");
  }finally{ btn.disabled=false; }
}
function bindGarmin(){
  view.querySelectorAll(".gbtn").forEach(b=>b.onclick=async()=>{
    const txt=ICU[Number(b.dataset.icu)]||"";
    try{ await navigator.clipboard.writeText(txt); b.textContent="Copied"; setTimeout(()=>{b.textContent="Copy for Garmin";},1600); }
    catch(e){ let box=b.parentElement.querySelector("textarea.icu"); if(!box){box=document.createElement("textarea");box.className="icu";box.readOnly=true;box.value=txt;b.parentElement.appendChild(box);} box.focus(); box.select(); }
  });
}
function renderAll(){
  renderBar(); renderConnect();
  // keep form edits on the Plan tab from being wiped by background syncs
  if(TAB==="plan"&&view.contains(document.activeElement)&&document.activeElement.tagName==="INPUT") return;
  ICU=[]; RENDER[TAB]&&RENDER[TAB](); bindGarmin();
}
document.querySelectorAll("#tabbar button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
document.getElementById("sync").onclick=()=>{ if(SYNC.state==="need"){const g=document.getElementById("cnGo"); if(g) g.click(); return;} SYNC={...SYNC,state:SYNC.state==="loading"?"loading":"idle"}; sync(true); };
if(/^#(week|progress|paces|plan)$/.test(location.hash)) TAB=location.hash.slice(1);
if(!RENDER[TAB]) TAB="week";
renderBar(); setTab(TAB);
(async()=>{
  await loadStore();
  const mcp=await getMcp();
  if(!mcp){SYNC={state:"off"};renderAll();return;}
  const P=await getPerms();
  const st=P?await P.state("mcp:Strava").catch(()=>"unavailable"):"unavailable";
  if(st==="denied"){SYNC={state:"denied"};renderAll();}
  else if(st==="prompt"){SYNC={state:"need"};renderAll();}
  else sync(false);
})();
</script>
